<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Aarvi Fashion Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff7fa;
  color:#392531
}

button,input,textarea,select{
  font:inherit
}

button{
  cursor:pointer;
  border:0
}

.hide{
  display:none!important
}

:root{
  --p:#d94f82;
  --d:#b83268;
  --s:#fff0f5;
  --b:#f0d7e1;
  --g:#29914b
}

.wrap{
  max-width:1200px;
  margin:auto;
  padding:16px
}

.card{
  background:#fff;
  border:1px solid var(--b);
  border-radius:20px;
  padding:18px;
  margin:14px 0
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px
}

.btn{
  background:var(--p);
  color:#fff;
  padding:10px 14px;
  border-radius:10px;
  font-weight:800
}

.secondary{
  background:#fff;
  color:var(--d);
  border:1px solid var(--b)
}

.danger{
  background:#8d274d
}

.green{
  background:var(--g)
}

input,
select,
textarea{
  width:100%;
  padding:11px;
  border:1px solid var(--b);
  border-radius:10px;
  margin:5px 0 12px
}

textarea{
  min-height:90px
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px
}

.stat{
  background:#fff;
  border:1px solid var(--b);
  border-radius:15px;
  padding:15px
}

.stat b{
  display:block;
  color:var(--d);
  font-size:24px;
  margin-top:5px
}

.tabs{
  display:flex;
  gap:7px;
  flex-wrap:wrap
}

.tab{
  background:#fff;
  border:1px solid var(--b);
  padding:10px 14px;
  border-radius:10px;
  color:var(--d);
  font-weight:700
}

.tab.active{
  background:var(--p);
  color:#fff
}

.sizes{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:8px
}

.photos{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px
}

.photos img{
  width:100%;
  height:100px;
  object-fit:contain;
  background:var(--s);
  border-radius:8px
}

.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px
}

.product{
  border:1px solid var(--b);
  border-radius:15px;
  overflow:hidden;
  background:#fff
}

.product>img{
  width:100%;
  height:210px;
  object-fit:contain;
  background:var(--s)
}

.pi{
  padding:12px
}

.order{
  border:1px solid var(--b);
  border-radius:14px;
  padding:14px;
  margin:10px 0;
  background:#fff
}

.badge{
  display:inline-block;
  padding:5px 9px;
  background:var(--s);
  color:var(--d);
  border-radius:20px;
  font-size:11px;
  font-weight:800
}

.msg,
.success,
.error{
  padding:10px;
  border-radius:10px;
  margin:8px 0
}

.msg{
  background:var(--s)
}

.success{
  background:#eefbf2;
  color:#26723a
}

.error{
  background:#fff0f0;
  color:#a52c2c
}

@media(max-width:800px){

  .products{
    grid-template-columns:repeat(2,1fr)
  }

  .stats{
    grid-template-columns:repeat(2,1fr)
  }

}

@media(max-width:600px){

  .grid{
    grid-template-columns:1fr
  }

  .products{
    grid-template-columns:1fr
  }

  .sizes{
    grid-template-columns:repeat(3,1fr)
  }

  .photos{
    grid-template-columns:repeat(2,1fr)
  }

}
</style>
</head>

<body>

<!-- ================= LOGIN ================= -->

<div
id="login"
class="card"
style="max-width:430px;margin:70px auto">

<h1>🌸 Aarvi Fashion</h1>

<b>Admin Login</b>

<input
id="email"
type="email"
value="amreshkumar97552@gmail.com">

<input
id="password"
type="password"
placeholder="Password">

<button
class="btn"
style="width:100%"
onclick="login()">

Login

</button>

<div
id="loginmsg"
class="msg hide">
</div>

</div>


<!-- ================= ADMIN APP ================= -->

<div
id="app"
class="wrap hide">

<div class="top">

<div>

<h1>
🌸 Aarvi Fashion Admin
</h1>

<p>
Products • Orders • Customers • Courier
</p>

</div>

<div>

<button
class="btn secondary"
onclick="openStore()">

Open Store

</button>

<button
class="btn"
style="background:#513540"
onclick="logout()">

Logout

</button>

</div>

</div>


<!-- ================= STATS ================= -->

<div class="stats">

<div class="stat">

Products

<b id="pc">
0
</b>

</div>

<div class="stat">

Stock

<b id="sc">
0
</b>

</div>

<div class="stat">

Orders

<b id="oc">
0
</b>

</div>

<div class="stat">

New

<b id="nc">
0
</b>

</div>

</div>


<!-- ================= TABS ================= -->

<div class="card tabs">

<button
class="tab active"
onclick="section('products',this)">

📦 Products

</button>

<button
class="tab"
onclick="section('orders',this)">

🛍️ Orders

</button>

<button
class="tab"
onclick="section('customers',this)">

👥 Customers

</button>

</div>


<!-- ================= PRODUCTS ================= -->

<section id="products">

<div class="card">

<h2>

</h2>

id="msg"

<div>

<label>

id="name"
placeholder="Product name">

</div>


<div>

<label>

<select id="category">
</select>

</div>


<div>

<label>
Selling Price
</label>

<input
id="price"
type="number"
min="0"
placeholder="999">

<div>

<label>
Original Price

<input

<!-- ================= SIZE STOCK ================= -->

<p>

Selected size ka stock order hone par automatically kam hoga.

</textarea>


<!-- ================= PHOTOS ================= -->

<label>
<b>
Photos — Maximum 4

</label>

<div class="grid">

<input
id="photo1"
type="file"
accept="image/*"
onchange="preview()">

<input
id="photo2"
type="file"
accept="image/*"
onchange="preview()">

<input
id="photo3"
type="file"
accept="image/*"
onchange="preview()">

<input
id="photo4"
type="file"
accept="image/*"
onchange="preview()">

</div>


<div
id="pre"
class="photos">

<br>


<button
class="btn"
onclick="addProduct()">

Save Product

</button>


<button
class="btn secondary"
onclick="clearForm()">

<!-- ================= PRODUCT LIST ================= -->

<div class="card">

<div class="top">

<h2>
📦 Products
</h2>

<button
class="btn secondary"
onclick="loadProducts()">

Refresh

</div>

id="productList"

id="orders"

<div class="card">

🛍️ Customer Orders

<button
class="btn secondary"
onclick="loadOrders()">

Refresh

</button>

</div>

id="orderList">
</div>

</div>

</section>


<!-- ================= CUSTOMERS ================= -->

<section
id="customers"
class="hide">

<div class="card">

<div class="top">

<h2>
👥 Customers
</h2>

<button
class="btn secondary"
onclick="loadCustomers()">

Refresh

</button>

</div>

<div
id="customerList">
</div>

</div>

</section>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://sxifooelnulxldcbtmvd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_nLLITIJxfhc52cUkZaGZ4w_GvJubfM-";


const sb =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================================
   CONSTANTS
========================================================= */

const CATS = [

"Plazzo",
"Pant Set",
"Dupatta Set",
"Kurta Set",
"Kurti Set",
"Dress Material",
"Combos",
"Daily Deals",
"Western Wear",
"Beauty",
"Jewellery"

];


const SIZES = [
"S",
"M",
"L",
"XL",
"XXL"
];


/* =========================================================
   HELPERS
========================================================= */

const $ =
id =>
document.getElementById(id);


function esc(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function msg(text,type="msg"){

$("msg").className=type;

$("msg").textContent=text;

$("msg").classList.remove("hide");

}


/* =========================================================
   CATEGORY + SIZE UI
========================================================= */

$("category").innerHTML =

CATS
.map(
x =>
`<option value="${esc(x)}">
${esc(x)}
</option>`
)
.join("");


$("sizeInputs").innerHTML =

SIZES
.map(
s =>

`

<div>

<label>
${s}
</label>

<input
id="stock_${s}"
type="number"
min="0"
value="0"
placeholder="${s} stock">

</div>

`
)
.join("");


/* =========================================================
   LOGIN
========================================================= */

async function login(){

const email =
$("email").value.trim();

const password =
$("password").value;


if(!email || !password){

$("loginmsg").textContent =
"Email aur password bhariye.";

$("loginmsg").classList.remove("hide");

return;

}


const {
error
} =
await sb.auth.signInWithPassword({

email,
password

});


if(error){

$("loginmsg").textContent =
error.message;

$("loginmsg").classList.remove("hide");

return;

}


openApp();

}


async function logout(){

await sb.auth.signOut();

location.reload();

}


async function openApp(){

$("login")
.classList.add("hide");

$("app")
.classList.remove("hide");

loadProducts();

loadOrders();

loadCustomers();

}


sb.auth
.getSession()
.then(x => {

if(x.data.session)
openApp();

});


/* =========================================================
   SECTION
========================================================= */

function section(id,button){

[
"products",
"orders",
"customers"
]
.forEach(
x =>
$(x).classList.add("hide")
);


$(id).classList.remove("hide");


document
.querySelectorAll(".tab")
.forEach(
x =>
x.classList.remove("active")
);


button.classList.add("active");


if(id==="orders")
loadOrders();


if(id==="customers")
loadCustomers();

}


/* =========================================================
   STORE
========================================================= */

function openStore(){

window.open(
"https://aarvi-fashion-ladies-collection.vercel.app",
"_blank"
);

}


/* =========================================================
   IMAGE HELPERS
========================================================= */

function parseImages(product){

let x=[];

try{

x =
Array.isArray(product.image_urls)
?
product.image_urls
:
JSON.parse(
product.image_urls || "[]"
);

}catch(e){}

if(
!x.length &&
product.image_url
){

x=[
product.image_url
];

}

return x
.slice(0,4);

}


function parseJSON(value){

try{

return typeof value==="object"
?
value
:
JSON.parse(value||"{}");

}catch(e){

return {};

}

}


/* =========================================================
   PHOTO PREVIEW
========================================================= */

function preview(){

$("pre").innerHTML =

[1,2,3,4]
.map(i => {

const file =
$("photo"+i)
.files[0];

if(!file)
return "";

return `

<img
src="${URL.createObjectURL(file)}">

`;

})
.join("");

}


/* =========================================================
   ADD PRODUCT
========================================================= */

async function addProduct(){

const name =
$("name")
.value
.trim();


const price =
Number(
$("price").value
);


const original =
Number(
$("original").value
) || null;


const description =
$("desc")
.value
.trim();


const sizeStock={};


SIZES.forEach(
s => {

const n =
Number(
$("stock_"+s).value
) || 0;

if(n>0)
sizeStock[s]=n;

});


const sizes =
Object.keys(sizeStock);


const stock =
Object
.values(sizeStock)
.reduce(
(a,b) =>
a+b,
0
);


const files =

[1,2,3,4]
.map(
i =>
$("photo"+i)
.files[0]
)
.filter(Boolean);


if(
!name ||
price<=0 ||
!sizes.length ||
!files.length
){

msg(
"Name, price, kam se kam 1 size stock aur 1 photo zaroori hai.",
"error"
);

return;

}


if(files.length>4){

msg(
"Maximum 4 photos.",
"error"
);

return;

}


try{

msg(
"Photos upload ho rahi hain..."
);


const urls=[];


for(
const file
of files
){

if(
!file.type.startsWith("image/") ||
file.size > 5*1024*1024
){

throw Error(
"Photo image ho aur 5MB se chhoti ho."
);

}


const path =

Date.now()
+
"-"
+
Math.random()
.toString(36)
.slice(2)
+
"-"
+
file.name.replace(
/[^a-zA-Z0-9.-]/g,
"-"
);


const upload =
await sb
.storage
.from("product-images")
.upload(
path,
file
);


if(upload.error)
throw Error(
upload.error.message
);


const publicUrl =
sb
.storage
.from("product-images")
.getPublicUrl(path)
.data
.publicUrl;


urls.push(publicUrl);

}


msg(
"Product save ho raha hai..."
);


const {
error
} =
await sb
.from("products")
.insert({

name:name,

category:
$("category").value,

price:price,

original_price:
original,

stock:
stock,

description:
description,

image_url:
urls[0],

image_urls:
JSON.stringify(urls),

sizes:
JSON.stringify(sizes),

size_stock:
sizeStock

});


if(error)
throw Error(
error.message
);


msg(
"Product successfully added ✅",
"success"
);


clearForm();

loadProducts();


}catch(e){

msg(
e.message,
"error"
);

}

}


/* =========================================================
   CLEAR PRODUCT FORM
========================================================= */

function clearForm(){

$("name").value="";

$("price").value="";

$("original").value="";

$("desc").value="";


[1,2,3,4]
.forEach(
i =>
$("photo"+i).value=""
);


SIZES.forEach(
s =>
$("stock_"+s).value=0
);


$("pre").innerHTML="";

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts(){

const {
data,
error
} =
await sb
.from("products")
.select("*")
.order(
"created_at",
{
ascending:false
}
);


if(error){

$("productList").innerHTML =

`

<div class="error">

${esc(error.message)}

</div>

`;

return;

}


$("pc")
.textContent =
data.length;


$("sc")
.textContent =

data.reduce(
(a,p) =>
a +
Number(p.stock||0),
0
);


$("productList").innerHTML =

data
.map(p => {

const im =
parseImages(p);

const ss =
parseJSON(
p.size_stock
);


return `

<div class="product">

<img
src="${esc(im[0]||"")}">

<div class="pi">

<h3>
${esc(p.name)}
</h3>

<div>
${esc(p.category)}
</div>

<p>

<b>
₹${Number(p.price||0)
.toLocaleString("en-IN")}
</b>

</p>

<p>

Sizes:
${esc(
Object.keys(ss)
.join(", ")
||
"—"
)}

<br>

Total Stock:
<b>
${Number(p.stock||0)}
</b>

</p>


<button
class="btn secondary"
onclick="editStock(${Number(p.id)},${Number(p.stock||0)})">

Edit Stock

</button>


<button
class="btn danger"
onclick="delProduct(${Number(p.id)})">

Delete

</button>

</div>

</div>

`;

})
.join("");


if(!data.length){

$("productList").innerHTML =
`
<div class="msg">
No products.
</div>
`;

}

}


/* =========================================================
   EDIT STOCK
========================================================= */

async function editStock(
id,
current
){

const value =
prompt(
"Total stock:",
current
);


if(value===null)
return;


const stock =
Number(value);


if(
!Number.isInteger(stock) ||
stock<0
){

alert(
"Valid stock quantity bhariye."
);

return;

}


const {
error
} =
await sb
.from("products")
.update({
stock:stock
})
.eq(
"id",
id
);


if(error)
alert(
error.message
);

else
loadProducts();

}


/* =========================================================
   DELETE PRODUCT
========================================================= */

async function delProduct(id){

if(
!confirm(
"Kya aap product delete karna chahte hain?"
)
)
return;


const {
error
} =
await sb
.from("products")
.delete()
.eq(
"id",
id
);


if(error)
alert(
error.message
);

else
loadProducts();

}


/* =========================================================
   LOAD ORDERS
========================================================= */

async function loadOrders(){

const {
data,
error
} =
await sb
.from("orders")
.select("*")
.order(
"created_at",
{
ascending:false
}
);


$("oc")
.textContent =
data?.length || 0;


$("nc")
.textContent =

(data||[])
.filter(
x =>
String(
x.order_status ||
"New"
)
.toLowerCase()
===
"new"
)
.length;


if(error){

$("orderList").innerHTML =

`

<div class="error">

${esc(error.message)}

</div>

`;

return;

}


if(!data?.length){

$("orderList").innerHTML =

`

<div class="msg">
No orders.
</div>

`;

return;

}


$("orderList").innerHTML =

data
.map(o =>

`

<div class="order">

<b>

#${esc(o.id)}

—

${esc(
o.product_name ||
"Product"
)}

</b>


<p>

Customer:
${esc(
o.customer_name ||
"-"
)}

<br>

Phone:
${esc(
o.phone ||
"-"
)}

<br>

Size:
${esc(
o.size ||
"-"
)}

•

Qty:
${esc(
o.quantity ||
1
)}

<br>

Address:
${esc(
o.address ||
""
)}

${esc(
o.city ||
""
)}

${esc(
o.state ||
""
)}

${esc(
o.pin_code ||
""
)}

<br>

Total:
₹${Number(
o.total_amount||0
)
.toLocaleString("en-IN")}

</p>


<span class="badge">

${esc(
o.order_status ||
"New"
)}

</span>


<div class="grid">


<div>

<label>
Order Status
</label>

<select
id="st_${o.id}">

${
[
"New",
"Confirmed",
"Packed",
"Shipped",
"Out for Delivery",
"Delivered",
"Cancelled",
"Returned"
]
.map(
s =>
`

<option
${
s ===
(o.order_status||"New")
?
"selected"
:
""
}>

${s}

</option>

`
)
.join("")
}

</select>

</div>


<div>

<label>
Courier
</label>

<input
id="co_${o.id}"
value="${esc(
o.courier_name ||
""
)}">

</div>


<div>

<label>
Tracking Number
</label>

<input
id="tn_${o.id}"
value="${esc(
o.tracking_number ||
""
)}">

</div>


<div>

<label>
Tracking URL
</label>

<input
id="tu_${o.id}"
value="${esc(
o.tracking_url ||
""
)}">

</div>

</div>


<button
class="btn green"
onclick="saveOrder(${o.id})">

Save Order / Tracking

</button>


</div>

`

)
.join("");

}


/* =========================================================
   SAVE ORDER
========================================================= */

async function saveOrder(id){

const obj={

order_status:
$("st_"+id).value,

courier_name:
$("co_"+id).value.trim(),

tracking_number:
$("tn_"+id).value.trim(),

tracking_url:
$("tu_"+id).value.trim()

};


const {
error
} =
await sb
.from("orders")
.update(obj)
.eq(
"id",
id
);


if(error){

alert(
error.message
);

return;

}


alert(
"Order updated ✅"
);


loadOrders();

}


/* =========================================================
   CUSTOMERS
========================================================= */

async function loadCustomers(){

const {
data,
error
} =
await sb
.from("customer_profiles")
.select("*")
.order(
"created_at",
{
ascending:false
}
);


if(error){

$("customerList").innerHTML =

`

<div class="error">

${esc(error.message)}

</div>

`;

return;

}


$("customerList").innerHTML =

(data||[])
.map(c =>

`

<div class="order">
