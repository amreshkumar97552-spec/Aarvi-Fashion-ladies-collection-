<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aarvi Fashion Admin</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#fff7fa;color:#3a2430}.wrap{max-width:1050px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #f0d8e1;border-radius:18px;padding:20px;margin:16px 0}h1{color:#d94f82}input,select,textarea{width:100%;padding:12px;margin:6px 0 14px;border:1px solid #e4cbd5;border-radius:10px}button{padding:12px 17px;border:0;border-radius:10px;background:#d94f82;color:#fff;font-weight:700;cursor:pointer}.danger{background:#8d274d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.product{border:1px solid #f0d8e1;border-radius:15px;overflow:hidden}.product img{width:100%;height:220px;object-fit:contain;background:#fff0f5}.info{padding:14px}.hide{display:none}.msg{background:#fff0f5;padding:10px;border-radius:10px}.top{display:flex;justify-content:space-between}@media(max-width:700px){.grid,.products{grid-template-columns:1fr}.top{display:block}}</style></head><body>
<div id="login" class="card" style="max-width:420px;margin:80px auto"><h1>🌸 Aarvi Fashion</h1><p>Admin Login</p><input id="email" value="amreshkumar97552@gmail.com"><input id="password" type="password" placeholder="Password"><button onclick="login()">Login</button><div id="loginmsg" class="msg hide"></div></div>
<div id="app" class="wrap hide"><div class="top"><div><h1>Aarvi Fashion Admin</h1><p>Products & Stock</p></div><div><button onclick="window.open('https://aarvi-fashion-ladies-collection.vercel.app','_blank')">Open Store</button> <button onclick="logout()">Logout</button></div></div>
<div class="card"><h2>Add Product</h2><div id="msg" class="msg hide"></div><div class="grid"><div><label>Name</label><input id="name"></div><div><label>Category</label><select id="category"><option>Saree</option><option>Kurti</option><option>Top</option><option>Suit</option></select></div><div><label>Selling Price</label><input id="price" type="number"></div><div><label>Original Price</label><input id="original" type="number"></div><div><label>Stock</label><input id="stock" type="number" value="1"></div><div><label>Photo</label><input id="photo" type="file" accept="image/*"></div></div><label>Description</label><textarea id="desc"></textarea><button onclick="add()">Save Product</button></div>
<div class="card"><h2>Products</h2><div id="products" class="products"></div></div></div>
<script>
const U="https://sxifooelnulxldcbtmvd.supabase.co",K="sb_publishable_nLLITIJxfhc52cUkZaGZ4w_GvJubfM-",sb=supabase.createClient(U,K);
const $=x=>document.getElementById(x);
function show(id,t){$(id).textContent=t;$(id).classList.remove("hide")}
async function login(){let r=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error)show("loginmsg",r.error.message);else openApp()}
async function logout(){await sb.auth.signOut();location.reload()}
function openApp(){$("login").classList.add("hide");$("app").classList.remove("hide");load()}
async function add(){
 let f=$("photo").files[0];if(!$("name").value||!$("price").value||!f){show("msg","Name, price और photo भरें");return}
 let path=Date.now()+"-"+f.name.replace(/[^a-zA-Z0-9.-]/g,"-");
 let u=await sb.storage.from("product-images").upload(path,f);if(u.error){show("msg",u.error.message);return}
 let url=sb.storage.from("product-images").getPublicUrl(path).data.publicUrl;
 let r=await sb.from("products").insert({name:$("name").value.trim(),category:$("category").value,price:Number($("price").value),original_price:Number($("original").value)||null,stock:Number($("stock").value)||0,description:$("desc").value.trim(),image_url:url});
 if(r.error){show("msg",r.error.message);return}show("msg","Product added ✅");$("name").value="";$("price").value="";$("original").value="";$("stock").value=1;$("desc").value="";$("photo").value="";load()
}
async function load(){let r=await sb.from("products").select("*").order("created_at",{ascending:false});let e=$("products");e.innerHTML="";if(r.error){e.textContent=r.error.message;return}(r.data||[]).forEach(p=>{let d=document.createElement("div");d.className="product";d.innerHTML='<img src="'+(p.image_url||"")+'"><div class="info"><b>'+esc(p.name)+'</b><p>'+esc(p.category||"")+' • ₹'+p.price+' • Stock: '+(p.stock||0)+'</p><button class="danger" onclick="del('+p.id+')">Delete</button></div>';e.appendChild(d)})}
async function del(id){if(!confirm("Delete product?"))return;let r=await sb.from("products").delete().eq("id",id);if(r.error)alert(r.error.message);else load()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
sb.auth.getSession().then(x=>{if(x.data.session)openApp()});
</script></body></html>
