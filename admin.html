<style>

*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,sans-serif;
background:#fff7fa;
color:#3a2430;
}

.wrap{
max-width:1200px;
margin:auto;
padding:20px;
}

.card{

border-radius:18px;
padding:20px;
margin:16px 0;

h1,
h2{

input,
select,
textarea{

padding:12px;
margin:6px 0 14px;
border:1px solid #e4cbd5;
border-radius:10px;
outline:none;
}

textarea{
min-height:90px;
resize:vertical;
}

button{
padding:11px 16px;
border:0;
border-radius:10px;

color:#fff;

.danger{

.secondary{

.green{
background:#29914b;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
}

.products{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:16px;
}

.product{
border:1px solid #f0d8e1;
border-radius:15px;
overflow:hidden;
background:white;
}

.product img{
width:100%;
height:220px;
object-fit:contain;
background:#fff0f5;
}

.info{
padding:14px;
}

.hide{
display:none!important;
}

.msg{
background:#fff0f5;
padding:10px;
border-radius:10px;
margin:10px 0;
}

.success{
background:#eefbf2;
color:#26723a;
padding:10px;
border-radius:10px;
margin:10px 0;
}

.error{
background:#fff0f0;
color:#a52c2c;
padding:10px;
border-radius:10px;
margin:10px 0;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.tabs{
display:flex;
gap:8px;
flex-wrap:wrap;
}

.tabs button{
background:white;
color:#d94f82;
border:1px solid #d94f82;
}

.tabs button.active{

color:white;
}

.order{
border:1px solid #f0d8e1;
border-radius:14px;
padding:15px;
margin:10px 0;
background:white;

.status{

padding:6px 10px;
border-radius:20px;
background:#d94f82;
color:white;
font-size:12px;
font-weight:bold;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:12px;
}

.stat{
background:white;
border:1px solid #f0d8e1;
border-radius:14px;
padding:17px;
}

.stat b{
display:block;
font-size:25px;
color:#d94f82;
margin-top:5px;
}

.photo-preview{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
margin-bottom:15px;
}

.photo-preview img{
width:100%;
height:100px;
object-fit:contain;
border:1px solid #eee;
border-radius:8px;
background:#fff0f5;
}


/* ================= CUSTOMER PROFILE PHOTO ================= */

.customer-avatar{
width:64px;
height:64px;

.customer-gallery{
display:grid;

.customer-gallery img{

height:70px;
object-fit:cover;

@media(max-width:600px){

}

.products{
grid-template-columns:1fr;

.top{
display:block;
}

.top button{
margin-top:5px;

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://sxifooelnulxldcbtmvd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_nLLITIJxfhc52cUkZaGZ4w_GvJubfM-";

const sb =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================================
   HELPERS
========================================================= */

const $=
id=>
document.getElementById(id);


function esc(value){

return String(value??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function showMessage(
id,
text,
type="msg"
){

const el=$(id);

if(!el)
return;

el.className=type;

el.textContent=text;

el.classList.remove("hide");

}


function money(value){

return Number(value||0)
.toLocaleString("en-IN");

}


/* =========================================================
   LOGIN
========================================================= */

async function login(){

const email=
$("email")
.value
.trim();

const password=
$("password")
.value;


if(!email||!password){

showMessage(
"loginmsg",
"Email aur password bhariye.",
"error"
);

return;

}


const{error}=
await sb.auth.signInWithPassword({

email:email,

password:password

});


if(error){

showMessage(
"loginmsg",
error.message,
"error"
);

return;

}


openApp();

}


async function logout(){

await sb.auth.signOut();

location.reload();

}


function openApp(){

$("login")
.classList.add("hide");

$("app")
.classList.remove("hide");

loadProducts();

loadOrders();

loadCustomers();

}


async function checkSession(){

const{data}=
await sb.auth.getSession();

if(data.session)
openApp();

}


checkSession();


/* =========================================================
   SECTION
========================================================= */

function showSection(
id,
button
){

document
.querySelectorAll(
"#productsSection,#ordersSection,#customersSection"
)
.forEach(
el=>
el.classList.add("hide")
);


$(id)
.classList.remove("hide");


document
.querySelectorAll(".tabs button")
.forEach(
b=>
b.classList.remove("active")
);


if(button)
button.classList.add("active");


if(id==="ordersSection")
loadOrders();


if(id==="customersSection")
loadCustomers();

}

   OPEN STORE
========================================================= */

function openStore(){

window.open(
"https://aarvi-fashion-ladies-collection.vercel.app",
"_blank"
);

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts(){

const container=
$("products");

container.innerHTML=
"<p>Loading products...</p>";


const{
data,
error
}=
await sb
.from("products")
.select("*")
.order(
"created_at",
{ascending:false}
);


if(error){

container.innerHTML=
`<div class="error">
${esc(error.message)}
</div>`;

return;

}


const products=
data||[];


$("productCount")
.textContent=
products.length;


$("stockCount")
.textContent=
products.reduce(
(sum,p)=>
sum+
Number(p.stock||0),
0
);


if(!products.length){

container.innerHTML=
`<div class="msg">
Abhi koi product nahi hai.
</div>`;

return;

}


container.innerHTML=
products.map(
p=>{

let images=[];

try{

if(p.image_urls)
images=
JSON.parse(
p.image_urls
);

}catch(e){}

if(!Array.isArray(images))
images=[];

if(
!images.length&&
p.image_url
){

images=[
p.image_url
];

}


return `

<div class="product">

<img
src="${esc(images[0]||"")}"
alt="${esc(p.name)}">

<div class="info">

<h3>
${esc(p.name)}
</h3>

<p>
${esc(p.category||"")}
</p>

<p>

<b
style="color:#d94f82">

₹${money(p.price)}

</b>

${
p.original_price
?
`<span
style="
text-decoration:line-through;
color:#999;
margin-left:6px">

₹${money(p.original_price)}

</span>`
:
""
}

</p>


<p>

Stock:
<b>
${Number(p.stock||0)}
</b>

</p>


<button
onclick="editStock(
${Number(p.id)},
${Number(p.stock||0)}
)">

Stock

</button>


<button
class="danger"
onclick="deleteProduct(
${Number(p.id)}
)">

Delete

</button>

</div>

</div>

`;

}).join("");

}


/* =========================================================
   ADD PRODUCT
========================================================= */

async function addProduct(){

const name=
$("name")
.value
.trim();

const category=
$("category")
.value;

const price=
Number(
$("price").value
);

const original=
Number(
$("original").value
)||null;

const stock=
Number(
$("stock").value
)||0;

const description=
$("desc")
.value
.trim();


const files=[
$("photo1").files[0],
$("photo2").files[0],
$("photo3").files[0],
$("photo4").files[0]
]
.filter(Boolean);


if(!name){

showMessage(
"msg",
"Product name bhariye.",
"error"
);

return;

}


if(!price){

showMessage(
"msg",
"Selling price bhariye.",
"error"
);

return;

}


if(!files.length){

showMessage(
"msg",
"Kam se kam 1 photo select karein.",
"error"
);

return;

}


showMessage(
"msg",
"Photos upload ho rahi hain..."
);


const urls=[];


for(
const file of files
){

const safeName=
file.name.replace(
/[^a-zA-Z0-9.-]/g,
"-"
);


const path=
Date.now()+
"-"+
Math.random()
.toString(36)
.slice(2)+
"-"+
safeName;


const upload=
await sb
.storage
.from("product-images")
.upload(
path,
file
);


if(upload.error){

showMessage(
"msg",
upload.error.message,
"error"
);

return;

}


const publicUrl=
sb
.storage
.from("product-images")
.getPublicUrl(path)
.data
.publicUrl;


urls.push(publicUrl);

}


showMessage(
"msg",
"Product save ho raha hai..."
);


const{error}=
await sb
.from("products")
.insert({

name:name,

category:category,

price:price,

original_price:original,

stock:stock,

description:description,

image_url:
urls[0],

image_urls:
JSON.stringify(urls)

});


if(error){

showMessage(
"msg",
error.message,
"error"
);

return;

}


showMessage(
"msg",
"Product successfully added! ✅",
"success"
);


clearProductForm();

loadProducts();

}


function clearProductForm(){

$("name").value="";

$("price").value="";

$("original").value="";

$("stock").value="1";

$("desc").value="";

$("photo1").value="";

$("photo2").value="";

$("photo3").value="";

$("photo4").value="";

}


/* =========================================================
   STOCK
========================================================= */

async function editStock(
id,
current
){

const value=
prompt(
"New stock quantity:",
current
);


if(value===null)
return;


const stock=
Number(value);


if(
!Number.isFinite(stock)||
stock<0
){

alert(
"Valid stock quantity bhariye."
);

return;

}


const{error}=
await sb
.from("products")
.update({
stock:stock
})
.eq("id",id);


if(error){

alert(error.message);

return;

}


loadProducts();

}


/* =========================================================
   DELETE
========================================================= */

async function deleteProduct(id){

if(
!confirm(
"Kya aap product delete karna chahte hain?"
)
)
return;


const{error}=
await sb
.from("products")
.delete()
.eq("id",id);


if(error){

alert(error.message);

return;

}


loadProducts();

}

   ORDERS
========================================================= */

$("orders");

data,

}=

container.innerHTML=
`<div class="error">

}

data||[];

orders.length;


$("newOrderCount")

orders.filter(
o=>
String(
o.order_status||
o.Order_states||
""

if(!orders.length){

`<div class="msg">

container.innerHTML=

const phone=

const whatsappText=

`Aarvi Fashion Order Update

Order ID: ${o.id}
Product: ${o.product_name||o.Product_name||"-"}

);


return `

<div class="order">

<h3>
🛍️ Order #${esc(o.id)}
</h3>

<p>
<b>Customer:</b>
${esc(
o.customer_name||
o.Customer_Name||
"-"
)}
</p>

<p>
<b>Phone:</b>
${esc(phone)}
</p>

<p>
<b>Product:</b>
${esc(
o.product_name||
o.Product_name||
"-"
)}
</p>

<p>
<b>Quantity:</b>
${esc(
o.quantity||
o.Quantity||
1
)}
</p>

${
o.size||
o.Size
?
`
<p>
<b>Size:</b>
${esc(
o.size||
o.Size
)}
</p>
`
:
""
}


<p>
<b>Address:</b>
${esc(
o.address||
o.Address||
"-"
)}

${esc(
o.city||
o.City||
""
)}

${esc(
o.state||
o.State||
""
)}

${esc(
o.pin_code||
o["Pin Code"]||

)}

</p>


<p>
<b>Payment:</b>
${esc(

</p>


<p>

<span class="status">

${esc(status)}

</p>


<label>
Order Status

<select

${

"New",

"Cancelled",

</select>


<button

Update Status

${
phone

`

WhatsApp Customer

</button>

`
:
""
}

</div>

`;

/* =========================================================
   UPDATE ORDER
========================================================= */

async function updateOrderStatus(id){

const select=
$("status-"+id);

if(!select)
return;


const status=
select.value;


const{error}=
await sb
.from("orders")
.update({

order_status:
status,

Order_states:
status

})
.eq(
"id",
id
);


if(error){

alert(
"Status update failed:\n"+
error.message
);

return;

}


alert(
"Order status updated! ✅"
);

loadOrders();

}


/* =========================================================
   CUSTOMERS

c=>{

let gallery=[];

gallery=
JSON.parse(
c.gallery_urls||"[]"

gallery=[];

if(!Array.isArray(gallery))
gallery=[];


const avatar=
c.avatar_url||
"https://via.placeholder.com/100?text=Aarvi";


return `

<div class="order">


<div
style="
display:flex;
gap:12px;
align-items:center">

<img
class="customer-avatar"
src="${esc(avatar)}"
alt="Customer photo">

<div>

<h3
style="margin:0">

👤
${esc(
c.full_name||
"Customer"
)}

</h3>

<small>
Aarvi Fashion Customer
</small>
