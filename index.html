<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff7fa;

button,
input,
textarea,
select{

button{

}

.wrap{

}

/* ================= HEADER ================= */

header{
  background:#fff;
  border-bottom:1px solid #f0d8e1;
  position:sticky;
  top:0;
  z-index:1000;
}

.header-inner{
  max-width:1150px;
  margin:auto;
  padding:10px 14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.brand{
  font-family:"Brush Script MT","Segoe Script",cursive;
  font-size:29px;
  font-weight:700;
  color:#d94f82;
  line-height:1;
}

.brand-sub{
  font-size:9px;
  color:#8c737c;
  margin-top:4px;
  letter-spacing:.5px;
}

.header-actions{
  display:flex;
  gap:6px;
}

.icon-btn{
  border:1px solid #f0d8e1;
  background:#fff;
  border-radius:12px;
  padding:8px 10px;
  color:#d94f82;
  font-weight:700;
}

/* ================= HERO ================= */

.hero{
  text-align:center;
  padding:20px 0 14px;
}

.hero h1{
  margin:0 0 6px;
  font-family:"Brush Script MT","Segoe Script",cursive;
  font-size:32px;
  color:#d94f82;
}

.hero p{
  margin:0 0 14px;
  color:#777;
  font-size:11px;
}

/* ================= CATEGORY ================= */

.category-title{
  font-size:14px;
  font-weight:800;
  margin:5px 0 9px;
  color:#4a303a;
}

.cats{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:9px;
  margin-bottom:18px;
}

.cat{
  border:0;
  background:transparent;
  padding:0;
  text-align:center;
  min-width:0;
}

.cat-photo{
  width:58px;
  height:58px;
  margin:auto;
  display:block;
  object-fit:cover;
  border-radius:50%;
  border:2px solid #f1d5df;
  background:#fff0f5;
  box-shadow:0 3px 9px rgba(70,25,45,.10);
}

.cat-name{
  display:block;
  margin-top:4px;
  font-size:9px;
  line-height:1.1;
  color:#6e5961;
  font-weight:700;
}

.cat.active .cat-photo{
  border-color:#d94f82;
  box-shadow:0 0 0 2px #ffe0eb;
}

.cat.active .cat-name{
  color:#d94f82;
}

/* ================= COLLECTION ================= */

.collection-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:10px 0;
}

.collection-title h2{
  margin:0;
  font-size:16px;
}

.collection-title span{
  font-size:10px;
  color:#999;
}

/* ================= PRODUCT GRID ================= */

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.card{
  background:#fff;
  border:1px solid #f0d8e1;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 2px 9px rgba(80,30,50,.04);
}

.gallery{
  position:relative;
  background:#fff0f5;
}

.product-photo{
  width:100%;
  height:245px;
  object-fit:contain;
  display:block;
  background:#fff0f5;
}

.photo-buttons{
  position:absolute;
  top:50%;
  left:6px;
  right:6px;
  transform:translateY(-50%);
  display:flex;
  justify-content:space-between;
}

.photo-buttons button{
  width:30px;
  height:30px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.94);
  font-size:18px;
}

.info{
  padding:10px;
}

.info h3{
  margin:0 0 4px;
  font-size:14px;
}

.category{
  color:#888;
  font-size:10px;
  margin-bottom:5px;
}

.price{
  color:#d94f82;
  font-size:18px;
  font-weight:900;
}

.original{
  color:#999;
  text-decoration:line-through;
  margin-left:5px;
  font-size:10px;
}

.stock{
  margin:6px 0;
  font-size:10px;
}

/* CUSTOMER KO STOCK NUMBER NAHI DIKHANA */
.customer-stock{
  color:#29914b;
  font-size:10px;
  font-weight:700;
}

.order{
  width:100%;
  border:0;
  padding:9px;
  border-radius:9px;
  background:#d94f82;
  color:#fff;
  font-weight:800;
  font-size:12px;
}

.wish{
  width:100%;
  margin-top:5px;
  padding:8px;
  border:1px solid #f0d8e1;
  background:#fff;
  color:#d94f82;
  border-radius:9px;
  font-weight:700;
  font-size:11px;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:40px 10px;
  color:#777;
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:5000;
  display:flex;
  align-items:center;
  justify-content:center;

.modal-box{

  max-width:520px;

  border-radius:18px;

  color:#d94f82;

.modal h2{

label{
  display:block;
  font-size:12px;
  font-weight:700;
  margin:9px 0 4px;
}

input,
textarea,
select{
  width:100%;
  padding:10px;

textarea{

.primary{

.tabs{

}

.tabs button{

.tabs button.active{

.notice{
  background:#fff0f5;

.success{

}

.error{
  background:#fff0f0;
  color:#a52c2c;
  padding:10px;
  border-radius:9px;
  margin-top:8px;
}

/* ================= ACCOUNT ================= */

.account-menu{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
}

.account-menu button{
  padding:12px;
  text-align:left;

  border-radius:11px;

.account-head{
  background:#fff0f5;

.account-head strong{

.order-item{

.order-product{

}

.order-product img{

.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  background:#d94f82;
  color:#fff;
  font-size:10px;
  font-weight:700;
}

.track-result{
  margin-top:12px;
}

/* ================= FOOTER ================= */

footer{
  margin-top:35px;
  background:#fff;
  border-top:1px solid #f0d8e1;
  padding:20px 12px;
  text-align:center;
  color:#666;
  font-size:11px;
}

footer a{
  color:#d94f82;

/* ================= MOBILE ================= */

@media(max-width:800px){

@media(max-width:390px){

  }

  .cat-photo{

    height:42px;
  }

  .cat-name{
    font-size:6.5px;
  }

  .product-photo{
    height:170px;
  }

}

</style>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://sxifooelnulxldcbtmvd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_nLLITIJxfhc52cUkZaGZ4w_GvJubfM-";

const sb =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


/* =========================================================
   GLOBAL
========================================================= */

let allProducts=[];

let selectedProduct=null;

let currentLoginMode="email";

let currentAuthMode="login";


/* =========================================================
   CATEGORY LIST
========================================================= */

const CATEGORIES=[

"Plazzo",
"Pant Set",
"Dupatta Set",
"Kurta Set",
"Kurti Set",
"Dress Material",
"Combos",
"Daily Deals",
"Western Wear",

/* =========================================================
   FIXED SYSTEMATIC CATEGORY PHOTOS
========================================================= */

const CATEGORY_IMAGES={

"Plazzo":
"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?auto=format&fit=crop&w=180&q=85",

"Pant Set":
"https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=180&q=85",

"Dupatta Set":

"Kurta Set":
"https://images.unsplash.com/photo-1583391733956-6c78276477e2?auto=format&fit=crop&w=180&q=85",

"Kurti Set":
"https://images.unsplash.com/photo-1594633312681-425c7b97ccd1?auto=format&fit=crop&w=180&q=85",

"Dress Material":

"Combos":
"https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=180&q=85",

"Daily Deals":
"https://images.unsplash.com/photo-1445205170230-053b83016050?auto=format&fit=crop&w=180&q=85",

"Western Wear":
"https://images.unsplash.com/photo-1525507119028-ed4c629a60a3?auto=format&fit=crop&w=180&q=85",

"Beauty":
"https://images.unsplash.com/photo-1596462502278-27bfdc403348?auto=format&fit=crop&w=180&q=85",

"Jewellery":
"https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?auto=format&fit=crop&w=180&q=85"

};


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function money(value){

return Number(value||0)
.toLocaleString("en-IN");

}


function closeModal(){

const modal=
document.querySelector(".modal");

if(modal)
modal.remove();

}


/* =========================================================
   CATEGORY RENDER
========================================================= */

function renderCategories(){

const box=
document.getElementById("cats");

box.innerHTML=

`

<button
class="cat active"
onclick="filterProducts('All',this)">

<img
class="cat-photo"
src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=180&q=85"
alt="All">

<span class="cat-name">
All
</span>

</button>

`

+

CATEGORIES.map(c=>`

<button
class="cat"
onclick="filterProducts('${esc(c)}',this)">

<img
class="cat-photo"
src="${CATEGORY_IMAGES[c]}"
alt="${esc(c)}"
loading="lazy">

<span class="cat-name">
${esc(c)}
</span>

</button>

`).join("");

}


/* =========================================================
   PRODUCT IMAGES
========================================================= */

function getImages(product){

let images=[];

try{

if(product.image_urls){

images=
JSON.parse(product.image_urls);

}

}catch(e){

images=[];

}

if(!Array.isArray(images))
images=[];

if(
!images.length &&
product.image_url
){

images=[
product.image_url
];

}

return images.filter(Boolean);

}


/* =========================================================
   PRODUCT GALLERY
========================================================= */

function makeGallery(product){

const images=
getImages(product);

if(!images.length){

return `

<div class="gallery">

<div
class="product-photo">
</div>

</div>

`;

}


const photos=

images.map(
(url,index)=>`

<img
src="${esc(url)}"
class="product-photo"
style="${
index===0
?
""
:
"display:none"
}"
alt="${esc(product.name)}">

`
).join("");


if(images.length===1){

return `

<div class="gallery">

${photos}

</div>

`;

}


return `

<div class="gallery">

${photos}

<div class="photo-buttons">

<button
type="button"
onclick="prevPhoto(this)">
‹
</button>

<button
type="button"
onclick="nextPhoto(this)">
›
</button>

</div>

</div>

`;

}


function prevPhoto(button){

const gallery=
button.closest(".gallery");

const photos=
gallery.querySelectorAll(".product-photo");

if(photos.length<2)
return;

let current=0;

photos.forEach(
(p,i)=>{

if(p.style.display!=="none")
current=i;

});


photos[current]
.style.display="none";

const previous=
(current-1+photos.length)
%photos.length;

photos[previous]
.style.display="block";

}


function nextPhoto(button){

const gallery=
button.closest(".gallery");

const photos=
gallery.querySelectorAll(".product-photo");

if(photos.length<2)
return;

let current=0;

photos.forEach(
(p,i)=>{

if(p.style.display!=="none")
current=i;

});


photos[current]
.style.display="none";

const next=
(current+1)
%photos.length;

photos[next]
.style.display="block";

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts(){

const container=
document.getElementById("products");

container.innerHTML=
`
<div class="empty">
Loading products...
</div>
`;


const {
data,
error
}=
await sb
.from("products")
.select("*")
.order(
"created_at",
{
ascending:false
}
);


if(error){

container.innerHTML=
`
<div class="empty">

Products load nahi ho rahe.

<br><br>

${esc(error.message)}

</div>
`;

return;

}


allProducts=
data||[];

renderProducts(allProducts);

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(products){

const container=
document.getElementById("products");

if(!products.length){

container.innerHTML=
`
<div class="empty">
No products available yet.
</div>
`;

return;

}


container.innerHTML=

products
.map(product=>{

const stock=
Number(product.stock||0);

const original=
Number(
product.original_price||0
);


return `

<article class="card">

${makeGallery(product)}

<div class="info">

<h3>
${esc(
product.name||"Product"
)}
</h3>

<div class="category">
${esc(
product.category||""
)}
</div>

<div class="price">

₹${money(product.price)}

${
original>
Number(product.price||0)
?

`
<span class="original">
₹${money(original)}
</span>
`

:

""

}

</div>


<!-- CUSTOMER KO EXACT STOCK NAHI DIKHAYA -->

<div class="stock">

${
stock>0

?

`
<span class="customer-stock">
✓ Available
</span>
`

:

`
<b style="color:#b52c2c">
Out of Stock
</b>
`

}

</div>


<button
class="order"
type="button"
${
stock<=0
?
"disabled style='opacity:.5'"
:
""
}
onclick="startOrder(${Number(product.id)})">

${
stock>0
?
"Order Now"
:
"Out of Stock"
}

</button>


<button
class="wish"
type="button"
onclick="toggleWishlist(${Number(product.id)})">

❤️ Wishlist

</button>

</div>

</article>

`;

})
.join("");

}


/* =========================================================
   FILTER
========================================================= */

function filterProducts(
category,
button
){

document
.querySelectorAll(".cat")
.forEach(
b=>b.classList.remove("active")
);

if(button)
button.classList.add("active");


if(category==="All"){

renderProducts(allProducts);

return;

}


const filtered=
allProducts.filter(
p=>
String(
p.category||""
)
.toLowerCase()
===
category.toLowerCase()
);


renderProducts(filtered);

}

/* =========================================================
   AUTH FORM
========================================================= */

/* =========================================================
   SIGN UP
========================================================= */

async function emailSignup(){

const name=
document
.getElementById("signupName")
.value
.trim();

const phone=
document
.getElementById("signupPhone")
.value
.trim();

const email=
document
.getElementById("signupEmail")
.value
.trim();

const password=
document
.getElementById("signupPassword")
.value;

const confirmPassword=
document
.getElementById("signupConfirm")
.value;

const message=
document
.getElementById("authMessage");


if(!name||!email||!password){

message.innerHTML=
`
<div class="error">
Required fields bhariye.
</div>
`;

return;

}


if(
phone &&
!/^[0-9]{10}$/.test(phone)
){

message.innerHTML=
`
<div class="error">
Valid 10 digit phone number bhariye.
</div>
`;

return;

}


if(password!==confirmPassword){

message.innerHTML=
`
<div class="error">
Password match nahi kar raha.
</div>
`;

return;

}


if(password.length<6){

message.innerHTML=
`
<div class="error">
Password minimum 6 characters ka hona chahiye.
</div>
`;

return;

}


const {
data,
error
}=
await sb.auth.signUp({

email,
password,

options:{
data:{
full_name:name,
phone:phone,
account_type:"Customer"
}
}

});


if(error){

message.innerHTML=
`
<div class="error">
${esc(error.message)}
</div>
`;

return;

}


if(data.session){

await saveProfile(
data.user,
name,
phone,
email,
"Customer"
);

message.innerHTML=
`
<div class="success">
Account successfully ban gaya! ✅
</div>
`;

setTimeout(
closeModal,
800
);

}else{

message.innerHTML=
`
<div class="success">
Account ban gaya! ✅
<br><br>
Email confirmation complete karke login karein.
</div>
`;

}

}

async function sendPhoneOTP(){

let phone=
document
.getElementById("authPhone")
.value
.trim();

if(
!/^[0-9]{10}$/.test(phone)
){

alert(
"10 digit mobile number bhariye."
);

return;

}


phone="+91"+phone;


const {
error
}=
await sb.auth.signInWithOtp({

phone,

options:{

}

});


if(error){

alert(

error.message
);

return;

renderOTPForm(phone);

function renderOTPForm(phone){

const area=
document.getElementById(
"authArea"
);

area.innerHTML=`

<label>
OTP
</label>

<input
id="otpCode"
type="text"
maxlength="6"
inputmode="numeric"
placeholder="6 digit OTP">


<button
class="primary"
onclick="verifyPhoneOTP('${phone}')">

Verify OTP

</button>


<div class="notice">

OTP ${esc(phone)} par bheja gaya hai.

</div>

`;

}


async function verifyPhoneOTP(phone){

const token=
document
.getElementById("otpCode")
.value
.trim();


if(!/^[0-9]{6}$/.test(token)){

alert(
"6 digit OTP bhariye."
);

return;

}


const {
data,
error
}=
await sb.auth.verifyOtp({

phone,
token,
type:"sms"

});


if(error){

alert(
"OTP verification failed:\n"+
error.message
);

return;

}


if(data.user){

const meta=
data.user.user_metadata||{};

await saveProfile(
data.user,
meta.full_name||"Customer",
phone.replace("+91",""),
meta.email||data.user.email||"",
"Customer"
);

}


closeModal();

}

.upsert({

full_name:

phone:
phone||null,

email:
email||null,

account_type:
accountType||"Customer"

});


if(error)
console.error(

error

async function submitOrder(){

const session=
await getSession();

if(!session){

alert(
"Login required."
);

return;

}


const name=
document
.getElementById("orderName")
.value
.trim();

const phone=
document
.getElementById("orderPhone")
.value
.trim();

const address=
document
.getElementById("orderAddress")
.value
.trim();

const city=
document
.getElementById("orderCity")
.value
.trim();

const state=
document
.getElementById("orderState")
.value
.trim();

const pincode=
document
.getElementById("orderPincode")
.value
.trim();

const qty=
Number(
document
.getElementById("orderQty")
.value
);

const payment=
document
.getElementById("orderPayment")
.value;


if(!name){

alert("Name bhariye.");

return;

}


if(
!/^[0-9]{10}$/.test(phone)
){

alert(
"Valid 10 digit mobile number bhariye."
);

return;

}


if(
!address||
!city||
!state
){

alert(
"Address, city aur state bhariye."
);

return;

}


if(
!/^[0-9]{6}$/.test(pincode)
){

alert(
"Valid 6 digit PIN bhariye."
);

return;

}


if(
!qty||
qty<1||
qty>
Number(
selectedProduct.stock||0
)
){

alert(
"Valid quantity bhariye."
);

return;

}


const paymentStatus=
payment==="COD"
?
"COD"
:
"Pending";


const orderData={

user_id:
session.user.id,

Customer_Name:
name,

Phone:
phone,

Address:
address,

City:
city,

State:
state,

"Pin Code":
pincode,

Product_name:
selectedProduct.name,

Quantity:
qty,

Payment_method:
payment,

Payment_status:
paymentStatus,

Order_states:
"New"

};


/*
  NOTE:
  Agar tumne Supabase mein table ka naam
  orders kar diya hai to neeche
  "ORDER'S" ko "orders" kar dena.
*/

const {
data,
error
}=
await sb
.from("ORDER'S")
.insert([
orderData
])
.select()
.single();


if(error){

alert(
"Order save nahi hua:\n"+
error.message
);

return;

}


closeModal();


const orderId=
data?.id||
"N/A";


const whatsappText=
`New Aarvi Fashion Order

Order ID: ${orderId}
Customer: ${name}
Phone: ${phone}
Product: ${selectedProduct.name}
Quantity: ${qty}
Payment: ${payment}
Address: ${address}, ${city}, ${state} - ${pincode}`;


const whatsappUrl=
"https://wa.me/916204117647?text="+
encodeURIComponent(
whatsappText
);


const modal=
document.createElement("div");

modal.className="modal";


modal.innerHTML=`

<div
class="modal-box"
style="text-align:center">

<h2>
🎉 Order Placed!
</h2>


<div class="success">

Aapka order successfully receive ho gaya hai.

</div>


<div class="notice">

<b>
Order ID:
</b>

${esc(orderId)}

<br><br>

Status:
<b>
New
</b>

</div>


<button
class="primary"
onclick="window.open('${whatsappUrl}','_blank')">

📱 WhatsApp Order Details

</button>


<button
class="secondary"
onclick="closeModal()">

Done

</button>

</div>

`;


document.body.appendChild(modal);

}

/* =========================================================
   TRACK
========================================================= */

async function trackOrder(){

const id=
Number(
document
.getElementById("trackId")
.value
);

const phone=
document
.getElementById("trackPhone")
.value
.trim();

const result=
document.getElementById(
"trackResult"
);


if(!id||!phone){

result.innerHTML=
`
<div class="error">
Order ID aur mobile number bhariye.
</div>
`;

return;

}


result.innerHTML=
`
<div class="notice">
Order check ho raha hai...
</div>
`;


const {
data,
error
}=
await sb.rpc(
"track_my_order",
{

order_id_input:id,

phone_input:phone

}
);


if(error){

result.innerHTML=
`
<div class="error">
${esc(error.message)}
</div>
`;

return;

}


if(!data){

result.innerHTML=
`
<div class="error">
Order nahi mila.
</div>
`;

return;

}


const status=
data.Order_states||
data.Order_status||
data.status||
"New";


result.innerHTML=`

<div class="order-item">

<h3
style="color:#d94f82">

Order Found ✅

</h3>


<p>

<b>
Order ID:
</b>

${esc(id)}

</p>


<p>

<b>
Product:
</b>

${esc(
data.Product_name||
data.product_name||
"-"
)}

</p>


<div class="status">

📦
${esc(status)}

</div>


${
data.tracking_number||
data.tracking_url

?

`

<div class="notice">

🚚

${
data.tracking_number
?

`
Tracking:
<b>
${esc(
data.tracking_number
)}
</b>
`

:

""

}


${
data.tracking_url

?

`
<br><br>

<a
href="${esc(
data.tracking_url
)}"
target="_blank"
style="
color:#d94f82;
font-weight:800">

Track Shipment →

</a>

`

:

""

}

</div>

`

:

""

}

</div>

`;

}
