<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aarvi Fashion - Ladies Collection</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fa;
      color: #3a2430;
    }

    .wrap {
      max-width: 1100px;
      margin: auto;
      padding: 24px;
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      color: #d94f82;
      letter-spacing: 2px;
    }

    header {
      margin-bottom: 20px;
    }

    .hero {
      text-align: center;
      padding: 45px 0;
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: 38px;
    }

    .hero p {
      margin: 0 0 20px;
      font-size: 17px;
    }

    .cats {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cats button {
      padding: 10px 16px;
      border: 1px solid #d94f82;
      border-radius: 20px;
      background: white;
      color: #d94f82;
      cursor: pointer;
    }

    .cats button:hover {
      background: #d94f82;
      color: white;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .card {
      background: #fff;
      border: 1px solid #f0d8e1;
      border-radius: 18px;
      overflow: hidden;
    }

    .gallery {
      position: relative;
      background: #fff0f5;
    }

    .product-photo {
      width: 100%;
      height: 270px;
      object-fit: contain;
      display: block;
      background: #fff0f5;
    }

    .photo-buttons {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      justify-content: space-between;
      padding: 0 8px;
    }

    .photo-buttons button {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,.9);
      cursor: pointer;
      font-size: 18px;
    }

    .info {
      padding: 15px;
    }

    .info h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .category {
      font-size: 14px;
      color: #777;
      margin-bottom: 8px;
    }

    .price {
      font-size: 21px;
      font-weight: 800;
      color: #d94f82;
      margin-bottom: 8px;
    }

    .stock {
      margin-bottom: 12px;
    }

    .order {
      display: block;
      width: 100%;
      text-align: center;
      padding: 11px;
      border-radius: 10px;
      background: #d94f82;
      color: white;
      border: none;
      font-weight: 700;
      cursor: pointer;
    }

    .order:hover {
      background: #c63f70;
    }

    .empty {
      text-align: center;
      padding: 40px 10px;
      grid-column: 1 / -1;
    }

    /* ORDER MODAL */

    .order-modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      z-index: 9999;
      overflow-y: auto;
    }

    .order-box {
      width: 100%;
      max-width: 520px;
      background: white;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 15px 50px rgba(0,0,0,.25);
    }

    .order-box h2 {
      margin: 0 0 8px;
      color: #d94f82;
    }

    .selected-product {
      background: #fff0f5;
      padding: 12px;
      border-radius: 10px;
      margin: 12px 0 18px;
    }

    .order-box label {
      display: block;
      margin: 10px 0 5px;
      font-weight: 700;
      font-size: 14px;
    }

    .order-box input,
    .order-box textarea,
    .order-box select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    .order-box input:focus,
    .order-box textarea:focus,
    .order-box select:focus {
      border-color: #d94f82;
    }

    .order-box textarea {
      min-height: 80px;
      resize: vertical;
    }

    .payment-note {
      font-size: 13px;
      color: #777;
      margin-top: 5px;
    }

    .place-order {
      width: 100%;
      border: none;
      padding: 13px;
      margin-top: 18px;
      border-radius: 10px;
      background: #d94f82;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .place-order:hover {
      background: #c63f70;
    }

    .cancel-order {
      width: 100%;
      border: 1px solid #ddd;
      padding: 11px;
      margin-top: 9px;
      border-radius: 10px;
      background: white;
      color: #555;
      cursor: pointer;
    }

    .cancel-order:hover {
      background: #f7f7f7;
    }

    @media (max-width: 850px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .wrap {
        padding: 15px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 30px;
      }

      .order-box {
        padding: 18px;
      }
    }
  </style>
</head>

  <script>
    const SUPABASE_URL =
      "https://sxifooelnulxldcbtmvd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_nLLITIJxfhc52cUkZaGZ4w_GvJubfM-";

    const sb = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    let allProducts = [];

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getImages(product) {
      let images = [];

      try {
        if (product.image_urls) {
          images = JSON.parse(product.image_urls);
        }
      } catch (e) {
        images = [];
      }

      if (!Array.isArray(images)) {
        images = [];
      }

      if (!images.length && product.image_url) {
        images = [product.image_url];
      }

      return images.filter(Boolean);
    }

    function makeGallery(images) {
      if (!images.length) {
        return `
          <div class="gallery">
            <div class="product-photo"></div>
          </div>
        `;
      }

      const photos = images.map((url, index) => `
        <img
          src="${esc(url)}"
          class="product-photo"
          style="${index === 0 ? "" : "display:none;"}"
          alt="Product image"
        >
      `).join("");

      if (images.length === 1) {
        return `
          <div class="gallery">
            ${photos}
          </div>
        `;
      }

      return `
        <div class="gallery">
          ${photos}

          <div class="photo-buttons">
            <button type="button" onclick="prevPhoto(this)">‹</button>
            <button type="button" onclick="nextPhoto(this)">›</button>
          </div>
        </div>
      `;
    }

    function prevPhoto(button) {
      const gallery = button.closest(".gallery");
      const photos = gallery.querySelectorAll(".product-photo");

      if (photos.length < 2) return;

      let current = 0;

      photos.forEach((photo, index) => {
        if (photo.style.display !== "none") {
          current = index;
        }
      });

      photos[current].style.display = "none";

      const previous =
        (current - 1 + photos.length) % photos.length;

      photos[previous].style.display = "block";
    }

    function nextPhoto(button) {
      const gallery = button.closest(".gallery");
      const photos = gallery.querySelectorAll(".product-photo");

      if (photos.length < 2) return;

      let current = 0;

      photos.forEach((photo, index) => {
        if (photo.style.display !== "none") {
          current = index;
        }
      });

      photos[current].style.display = "none";

      const next =
        (current + 1) % photos.length;

      photos[next].style.display = "block";
    }

    function renderProducts(products) {
      const container = document.getElementById("products");

      if (!products.length) {
        container.innerHTML = `
          <div class="empty">
            No products available yet.
          </div>
        `;
        return;
      }

      container.innerHTML = products.map(product => {

        const images = getImages(product);

        return `
          <article class="card">

            ${makeGallery(images)}

            <div class="info">

              <h3>${esc(product.name || "Product")}</h3>

              <div class="category">
                ${esc(product.category || "")}
              </div>

              <div class="price">
                ₹${esc(product.price || "0")}
              </div>

              <div class="stock">
                Stock: ${esc(product.stock ?? 0)}
              </div>

              <button
                type="button"
                class="order"
                data-name="${esc(product.name || "Product")}"
                data-price="${Number(product.price) || 0}"
                onclick="openOrderFormFromButton(this)">
                Order Now
              </button>

            </div>
          </article>
        `;

      }).join("");
    }

    function filterProducts(category) {

      if (category === "All") {
        renderProducts(allProducts);
        return;
      }

      const filtered = allProducts.filter(product =>
        String(product.category || "")
          .toLowerCase() === category.toLowerCase()
      );

      renderProducts(filtered);
    }

<script>
async function requireCustomerLogin() {
    const { data: { session } } = await sb.auth.getSession();

    if (session) {
        return true;
    }

    const email = prompt("Login ke liye apna email enter karein:");
    if (!email) return false;

    const password = prompt("Password enter karein:");
    if (!password) return false;

    const { error } = await sb.auth.signInWithPassword({
        email: email.trim(),
        password: password
    });

    if (!error) {
        alert("Login successful!");
        return true;
    }

    const signup = confirm(
        "Login nahi hua.\n\nKya aap naya account banana chahte hain?"
    );

    if (!signup) return false;

    const { data, error: signupError } = await sb.auth.signUp({
        email: email.trim(),
        password: password
    });

    if (signupError) {
        alert("Signup error: " + signupError.message);
        return false;
    }

    if (data.session) {
        alert("Account ban gaya! Ab aap order kar sakte hain.");
        return true;
    }

    alert(
        "Account ban gaya.\n\nApne email par confirmation link check karein, " +
        "phir login karke order karein."
    );

    return false;
}

   async function openOrderFormFromButton(button) {

            type="tel"
            maxlength="10"
            placeholder="Enter 10 digit mobile number"
          >


          <label>Full Address *</label>

            placeholder="House no., street, area"

          <label>City *</label>

            min="1"

          >

            </option>

          <div class="payment-note">

          </div>


          <button

    function closeOrderForm() {

      const modal =
        document.getElementById("orderModal");

      if (modal) {
        modal.remove();
      }
    }


    async function submitWebsiteOrder() {

      const customerName =
        document.getElementById("orderName")
          .value.trim();

      const phone =
        document.getElementById("orderPhone")
          .value.trim();

      const address =
        document.getElementById("orderAddress")
          .value.trim();

      const city =
        document.getElementById("orderCity")
          .value.trim();

      const state =
        document.getElementById("orderState")
          .value.trim();

      const pincode =
        document.getElementById("orderPincode")
          .value.trim();

      const quantity =
        Number(
          document.getElementById("orderQty")
            .value
        );

      const paymentMethod =
        document.getElementById("orderPayment")
          .value;


      const productBox =
        document.querySelector(".selected-product");

      const productName =
        productBox
          ? productBox.querySelector("strong").textContent
          : "Product";


      if (!customerName) {
        alert("Please enter your name.");
        return;
      }

      if (!/^[0-9]{10}$/.test(phone)) {
        alert("Please enter a valid 10 digit mobile number.");
        return;
      }

      if (!address) {
        alert("Please enter your full address.");
        return;
      }

      if (!city) {
        alert("Please enter your city.");
        return;
      }

      if (!state) {
        alert("Please enter your state.");
        return;
      }

      if (!/^[0-9]{6}$/.test(pincode)) {
        alert("Please enter a valid 6 digit PIN code.");
        return;
      }

      if (!quantity || quantity < 1) {
        alert("Please enter a valid quantity.");
        return;
      }


      const paymentStatus =
        paymentMethod === "COD"
          ? "COD"
          : "Pending";


      const orderData = {

        Customer_Name:
          customerName,

        Phone:
          phone,

        Address:
          address,

        City:
          city,

        State:
          state,

        "Pin Code":
          pincode,

        Product_name:
          productName,

        Quantity:
          quantity,

        Payment_method:
          paymentMethod,

        Payment_status:
          paymentStatus,

        Order_states:
          "New"

      };


      const { error } =
        await sb
          .from("ORDER'S")
          .insert([orderData]);


      if (error) {

        console.error(
          "Order error:",
          error
        );

        alert(
          "Order save nahi hua.\n\n" +
          error.message
        );

        return;
      }


      alert(
        "Order successfully placed! ✅\n\n" +
        "Aapka order receive ho gaya hai."
      );


      closeOrderForm();
    }


    /* ============================
       LOAD PRODUCTS
    ============================ */

    async function loadProducts() {

      const container =
        document.getElementById("products");

      container.innerHTML = `
        <div class="empty">
          Loading products...
        </div>
      `;


      const { data, error } =
        await sb
          .from("products")
          .select("*")
          .order("created_at", {
            ascending: false
          });


      if (error) {

        console.error(error);

        container.innerHTML = `
          <div class="empty">
            Products load nahi ho rahe.<br>
            Please check Supabase table and connection.
          </div>
        `;

        return;
      }


      allProducts =
        data || [];


      renderProducts(
        allProducts
      );
    }


    loadProducts();

  </script>

<div id="trackModal" class="track-modal">

  <div class="track-box">

    <button
      class="track-close"
      onclick="closeTrackOrder()">
      ×
    </button>

    <h2>🚚 Track Your Order</h2>

    <p>Apna mobile number daaliye.</p>

    <input
      id="trackPhone"
      type="tel"
      inputmode="numeric"
      maxlength="10"
      placeholder="10 digit mobile number"
    >

    <button
      class="track-search"
      onclick="trackByPhone()">
      Track Order
    </button>

    <div
      id="trackResult"
      style="margin-top:18px;">
    </div>

  </div>

</div>

<script>

async function trackByPhone() {

  const phone = document
    .getElementById("trackPhone")
    .value
    .replace(/\D/g, "");

  const result =
    document.getElementById("trackResult");

  if (phone.length !== 10) {

    result.innerHTML = `
      <div class="track-order-card">
        ⚠️ 10 digit mobile number daaliye.
      </div>
    `;

    return;
  }

  result.innerHTML = `
    <div class="track-order-card">
      🔎 Order search ho raha hai...
    </div>
  `;

  const { data, error } = await sb.rpc(
    "track_orders_by_phone",
    {
      phone_input: phone
    }
  );

  if (error) {

    console.error(error);

    result.innerHTML = `
      <div class="track-order-card">
        ❌ Tracking mein problem aa rahi hai.
      </div>
    `;

    return;
  }

  if (!data || data.length === 0) {

    result.innerHTML = `
      <div class="track-order-card">
        ❌ Is mobile number se koi order nahi mila.
      </div>
    `;

    return;
  }

  let orders = Array.isArray(data)
    ? data
    : [data];

  result.innerHTML = `
    <h3 style="color:#d94f82;">
      Your Orders (${orders.length})
    </h3>

    ${orders.map((order, index) => {

      const status =
        order.Order_states ||
        order.order_status ||
        order.status ||
        "Order Received";

      const product =
        order.Product_name ||
        order.product_name ||
        order.product ||
        order.name ||
        "Your Order";

      const amount =
        order.Total_amount ||
        order.total_amount ||
        order.amount ||
        order.price ||
        "0";

      const orderId =
        order.id ||
        order.order_id ||
        "Generated";

      return `
        <div class="track-order-card">

          <h3>
            📦 Order ${index + 1}
          </h3>

          <p>
            <b>Order ID:</b>
            ${escapeTrack(String(orderId))}
          </p>

          <p>
            <b>Product:</b>
            ${escapeTrack(String(product))}
          </p>

          <p>
            <b>Amount:</b>
            ₹${escapeTrack(String(amount))}
          </p>

          <div class="track-status">
            🚚 ${escapeTrack(String(status))}
          </div>

        </div>
      `;

    }).join("")}
  `;
}


function escapeTrack(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

function escapeHtml(value) {
