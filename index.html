<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Aarvi Fashion - Ladies Collection</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff7fa;
      color: #3a2430;
    }

    .wrap {
      max-width: 1100px;
      margin: auto;
      padding: 24px;
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
      color: #d94f82;
      letter-spacing: 2px;
    }

    header {
      margin-bottom: 20px;
    }

    .hero {
      text-align: center;
      padding: 45px 0;
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: 38px;
    }

    .hero p {
      margin: 0 0 20px;
      font-size: 17px;
    }

    .cats {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cats button {
      padding: 10px 16px;
      border: 1px solid #d94f82;
      border-radius: 20px;
      background: white;
      color: #d94f82;
      cursor: pointer;
    }

    .cats button:hover {
      background: #d94f82;
      color: white;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .card {
      background: #fff;
      border: 1px solid #f0d8e1;
      border-radius: 18px;
      overflow: hidden;
    }

    .gallery {
      position: relative;
      background: #fff0f5;
    }

    .product-photo {
      width: 100%;
      height: 270px;
      object-fit: contain;
      display: block;
      background: #fff0f5;
    }

    .photo-buttons {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      justify-content: space-between;
      padding: 0 8px;
    }

    .photo-buttons button {
      width: 34px;
      height: 34px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,.9);
      cursor: pointer;
      font-size: 18px;
    }

    .info {
      padding: 15px;
    }

    .info h3 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .category {
      font-size: 14px;
      color: #777;
      margin-bottom: 8px;
    }

    .price {
      font-size: 21px;
      font-weight: 800;
      color: #d94f82;
      margin-bottom: 8px;
    }

    .stock {
      margin-bottom: 12px;
    }

    .order {
      display: block;
      text-align: center;
      padding: 11px;
      border-radius: 10px;
      background: #d94f82;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }

    .empty {
      text-align: center;
      padding: 40px 10px;
      grid-column: 1 / -1;
    }

    @media (max-width: 850px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 500px) {
      .wrap {
        padding: 15px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="wrap">

    <header>
      <div class="brand">AARVI FASHION</div>
      <div>Saree • Kurti • Top • Suit</div>
    </header>

    <main>

      <section class="hero">
        <h1>Style that feels beautifully yours.</h1>
        <p>COD • UPI • All India Delivery</p>

        <div class="cats">
          <button onclick="filterProducts('All')">All</button>
          <button onclick="filterProducts('Saree')">Saree</button>
          <button onclick="filterProducts('Kurti')">Kurti</button>
          <button onclick="filterProducts('Top')">Top</button>
          <button onclick="filterProducts('Suit')">Suit</button>
        </div>
      </section>

      <div id="products" class="grid"></div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://sxifooelnulxldcbtmvd.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_nLLITIJxfhc52cUkZaGZ4w_GvJubfM-";

    const sb = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    let allProducts = [];

    function esc(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getImages(product) {
      let images = [];

      try {
        if (product.image_urls) {
          images = JSON.parse(product.image_urls);
        }
      } catch (e) {
        images = [];
      }

      if (!Array.isArray(images)) {
        images = [];
      }

      if (!images.length && product.image_url) {
        images = [product.image_url];
      }

      return images.filter(Boolean);
    }

    function makeGallery(images) {
      if (!images.length) {
        return `
          <div class="gallery">
            <div class="product-photo"></div>
          </div>
        `;
      }

      const photos = images.map((url, index) => `
        <img
          src="${esc(url)}"
          class="product-photo"
          style="${index === 0 ? "" : "display:none;"}"
          alt="Product image"
        >
      `).join("");

      if (images.length === 1) {
        return `
          <div class="gallery">
            ${photos}
          </div>
        `;
      }

      return `
        <div class="gallery">
          ${photos}

          <div class="photo-buttons">
            <button onclick="prevPhoto(this)">‹</button>
            <button onclick="nextPhoto(this)">›</button>
          </div>
        </div>
      `;
    }

    function prevPhoto(button) {
      const gallery = button.closest(".gallery");
      const photos = gallery.querySelectorAll(".product-photo");

      if (photos.length < 2) return;

      let current = 0;

      photos.forEach((photo, index) => {
        if (photo.style.display !== "none") {
          current = index;
        }
      });

      photos[current].style.display = "none";

      const previous =
        (current - 1 + photos.length) % photos.length;

      photos[previous].style.display = "block";
    }

    function nextPhoto(button) {
      const gallery = button.closest(".gallery");
      const photos = gallery.querySelectorAll(".product-photo");

      if (photos.length < 2) return;

      let current = 0;

      photos.forEach((photo, index) => {
        if (photo.style.display !== "none") {
          current = index;
        }
      });

      photos[current].style.display = "none";

      const next =
        (current + 1) % photos.length;

      photos[next].style.display = "block";
    }

    function renderProducts(products) {
      const container = document.getElementById("products");

      if (!products.length) {
        container.innerHTML = `
          <div class="empty">
            No products available yet.
          </div>
        `;
        return;
      }

      container.innerHTML = products.map(product => {

        const images = getImages(product);

        return `
          <article class="card">

            ${makeGallery(images)}

            <div class="info">

              <h3>${esc(product.name || "Product")}</h3>

              <div class="category">
                ${esc(product.category || "")}
              </div>

              <div class="price">
                ₹${esc(product.price || "0")}
              </div>

              <div class="stock">
                Stock: ${esc(product.stock ?? 0)}
              </div>

             <button
  class="order"
  data-name="${esc(product.name)}"
  data-price="${Number(product.price) || 0}"
  onclick="openOrderFormFromButton(this)">
  Order Now
</button> 

            </div>
          </article>
        `;

      }).join("");
    }

    function filterProducts(category) {

      if (category === "All") {
        renderProducts(allProducts);
        return;
      }

      const filtered = allProducts.filter(product =>
        String(product.category || "")
          .toLowerCase() === category.toLowerCase()
      );

      renderProducts(filtered);
    }

    async function loadProducts() {

      const container = document.getElementById("products");

      container.innerHTML = `
        <div class="empty">
          Loading products...
        </div>
      `;

      const { data, error } = await sb
        .from("products")
        .select("*")
        .order("created_at", {
          ascending: false
        });

      if (error) {
        console.error(error);

        container.innerHTML = `
          <div class="empty">
            Products load nahi ho rahe.<br>
            Please check Supabase table and connection.
          </div>
        `;

        return;
      }

      allProducts = data || [];

      renderProducts(allProducts);
    }

    loadProducts();
  </script>

</body>
</html>
