<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Aarvi Fashion</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff7fa;
  color:#392531
}

button,input,textarea,select{
  font:inherit
}

button{
  cursor:pointer;
  border:0
}

:root{
  --pink:#d94f82;
  --dark:#b83268;
  --soft:#fff0f5;
  --border:#f0d7e1
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:#fff
}

.top{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:8px 10px
}

.toprow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px
}

.brand{
  font-weight:900;
  color:var(--dark);
  font-size:18px;
  letter-spacing:1px
}

.icon{
  width:34px;
  height:34px;
  border-radius:13px;
  background:var(--soft);
  color:var(--dark);
  font-size:18px
}

.search{
  margin-top:6px;
  display:flex;
  background:#fff7fa;
  border:1px solid var(--border);
  border-radius:14px;
  padding:0 12px
}

.search input{
  border:0;
  outline:0;
  background:transparent;
  width:100%;
  padding:8px
}

main{
  padding:10px 10px 78px
}

.hero{
  background:linear-gradient(135deg,#fff0f5,#ffe2ed);
  border-radius:22px;
  padding:10px;
  margin-bottom:10px
}

.hero h1{
  margin:0 0 7px;
  font-size:21px
}

.hero p{
  margin:0;
  color:#765c67
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:18px 0 10px
}

.section-title h2{
  font-size:13px;
  margin:0
}

.cats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px
}

.cat{
  border:1px solid var(--border);
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  text-align:left
}

.cat img{
  width:100%;
  height:58px;
  object-fit:cover;
  background:var(--soft)
}

.cat b{
  display:block;
  padding:6px;
  font-size:10px
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:7px
}

.product{
  border:1px solid var(--border);
  border-radius:17px;
  overflow:hidden;
  background:#fff
}

.product img{
  width:100%;
  height:155px;
  object-fit:contain;
  background:#fff0f5
}

.pi{
  padding:8px
}

.pi h3{
  margin:0 0 5px;
  font-size:13px
}

.muted{
  color:#806a73;
  font-size:10px
}

.price{
  color:var(--dark);
  font-weight:900;
  font-size:15px;
  margin:5px 0
}

.old{
  text-decoration:line-through;
  color:#999;
  font-size:10px;
  margin-left:4px
}

.btn{
  width:100%;
  padding:8px;
  border-radius:11px;
  background:var(--pink);
  color:#fff;
  font-weight:800
}

.out{
  color:#a52c2c;
  font-weight:700;
  font-size:10px
}

.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  height:58px;
  background:#fff;
  border-top:1px solid var(--border);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  z-index:25
}

.bottom button{
  background:#fff;
  color:#806a73
}

.bottom .active{
  color:var(--pink);
  font-weight:800
}

.drawer{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:50;
  display:none
}

.drawer.open{
  display:block
}

.menu{
  width:82%;
  max-width:390px;
  height:100%;
  background:#fff;
  padding:14px;
  overflow:auto
}

.menu h2{
  color:var(--dark)
}

.menu button{
  display:block;
  width:100%;
  text-align:left;
  padding:10px;
  border-radius:12px;
  background:#fff;
  margin:4px 0
}

.menu button:hover{
  background:var(--soft)
}

.screen{
  display:none
}

.screen.active{
  display:block
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:60;
  display:flex;
  align-items:flex-end
}

.box{
  width:100%;
  max-width:520px;
  margin:auto;
  background:#fff;
  border-radius:24px 24px 0 0;
  padding:14px;
  max-height:92vh;
  overflow:auto
}

.box input,
.box textarea,
.box select{
  width:100%;
  padding:9px;
  border:1px solid var(--border);
  border-radius:11px;
  margin:5px 0 12px
}

.sizes{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:8px 0 12px
}

.size{
  padding:7px 10px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff
}

.size.sel{
  background:var(--pink);
  color:#fff
}

.qty{
  display:flex;
  align-items:center;
  gap:10px
}

.qty button{
  width:34px;
  height:34px;
  border-radius:10px;
  background:var(--soft)
}

.order-card{
  border:1px solid var(--border);
  border-radius:16px;
  padding:12px;
  margin:10px 0;
  display:flex;
  gap:12px
}

.order-card img{
  width:75px;
  height:90px;
  object-fit:contain;
  background:var(--soft);
  border-radius:10px
}

.badge{
  display:inline-block;
  padding:4px 7px;
  border-radius:20px;
  background:var(--soft);
  color:var(--dark);
  font-size:11px;
  font-weight:800
}

.profile{
  background:linear-gradient(135deg,#fff0f5,#fff);
  border:1px solid var(--border);
  padding:18px;
  border-radius:18px
}

.field{
  margin:8px 0
}

.field label{
  display:block;
  font-size:10px;
  font-weight:700;
  margin-bottom:4px
}

.empty{
  text-align:center;
  padding:35px 10px;
  color:#806a73
}

@media(max-width:380px){
  .cats{
    grid-template-columns:repeat(4,1fr)
  }

  .cat img{
    height:58px
  }

  .product img{
    height:145px
  }
}
</style>
</head>

<body>

<div class="app">

<header class="top">

  <div class="toprow">

    <button
      class="icon"
      onclick="openMenu()">
      ☰
    </button>

    <div class="brand">
      AARVI FASHION
    </div>

    <button
      class="icon"
      onclick="showScreen('account')">
      👤
    </button>

  </div>

  <div class="search">
    <span>⌕</span>

    <input
      id="search"
      placeholder="Search products..."
      oninput="renderProducts()">
  </div>

</header>


<main>

<section
  id="home"
  class="screen active">

  <div class="hero">

    <h1>
      Style that feels beautifully yours.
    </h1>

    <p>
      Fashion • Beauty • Jewellery
    </p>

  </div>


  <div class="section-title">

    <h2>
      Shop by Category
    </h2>

  </div>


  <div
    id="cats"
    class="cats">
  </div>


  <div class="section-title">

    <h2 id="productTitle">
      Latest Collection
    </h2>

  </div>


  <div
    id="products"
    class="products">
  </div>

</section>


<section
  id="orders"
  class="screen">

  <div class="section-title">

    <h2>
      My Orders
    </h2>

    <button
      class="icon"
      onclick="loadOrders()">
      ↻
    </button>

  </div>

  <div id="ordersList"></div>

</section>


<section
  id="account"
  class="screen">

  <div class="section-title">

    <h2>
      My Account
    </h2>

  </div>

  <div id="accountBox"></div>

</section>

</main>


<nav class="bottom">

  <button
    id="navHome"
    class="active"
    onclick="showScreen('home')">
    ⌂<br>
    <small>Home</small>
  </button>

  <button
    id="navOrders"
    onclick="showScreen('orders')">
    🛍<br>
    <small>Orders</small>
  </button>

  <button
    id="navAccount"
    onclick="showScreen('account')">
    👤<br>
    <small>Account</small>
  </button>

</nav>

</div>


<!-- THREE LINE MENU -->

<div
  id="drawer"
  class="drawer"
  onclick="closeMenu()">

  <div
    class="menu"
    onclick="event.stopPropagation()">

    <button onclick="closeMenu()">
      ✕ Close
    </button>

    <h2>
      Menu
    </h2>

    <button onclick="goHome()">
      🏠 Home
    </button>

    <button
      onclick="showScreen('orders');closeMenu()">
      🛍️ My Orders
    </button>

    <button
      onclick="showScreen('account');closeMenu()">
      👤 My Account
    </button>

    <button onclick="contact()">
      💬 Contact
    </button>

    <button onclick="help()">
      ❓ Help
    </button>

  </div>

</div>


<div id="modalRoot"></div>


<script>

const SUPABASE_URL =
"https://sxifooelnulxldcbtmvd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_nLLITIJxfhc52cUkZaGZ4w_GvJubfM-";

const sb =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let allProducts=[];
let currentProduct=null;
let selectedSize="";
let qty=1;
let currentCategory="All";


/*
  KURTA SET HATA DIYA HAI
*/
const CATS=[
  "Plazzo",
  "Pant Set",
  "Dupatta Set",
  "Kurti Set",
  "Dress Material",
  "Combos",
  "Daily Deals",
  "Western Wear",
  "Beauty",
  "Jewellery"
];


const esc=v=>
String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");


function imgs(p){

  let x=[];

  try{

    x=Array.isArray(p.image_urls)
      ? p.image_urls
      : JSON.parse(p.image_urls||"[]");

  }catch{}

  if(!x.length && p.image_url)
    x=[p.image_url];

  return x
    .filter(Boolean)
    .slice(0,4);

}


function sizes(p){

  try{

    return Array.isArray(p.sizes)
      ? p.sizes
      : JSON.parse(p.sizes||"[]");

  }catch{

    return[];

  }

}


async function loadProducts(){

  const {
    data,
    error
  }=
    await sb
      .from("products")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );


  if(error){

    $("products").innerHTML=
      '<div class="empty">Products load nahi ho rahe.</div>';

    return;

  }


  allProducts=data||[];

  renderCategories();

  renderProducts();

}


const $=
id=>document.getElementById(id);


function categoryImage(c){

  let p=
    allProducts.find(
      x=>
        String(
          x.category||""
        ).toLowerCase()===
        c.toLowerCase()
    );

  return p
    ? imgs(p)[0]
    : "";

}


function renderCategories(){

  $("cats").innerHTML=
    CATS.map(
      c=>

      `<button
        class="cat"
        onclick="filterCat('${esc(c)}')">

        <img
          src="${esc(categoryImage(c))}"
          alt="${esc(c)}">

        <b>
          ${esc(c)}
        </b>

      </button>`

    ).join("");

}


function filterCat(c){

  currentCategory=c;

  showScreen("home");

  $("productTitle").textContent=c;

  renderProducts();

}


function renderProducts(){

  let q=
    $("search")
      .value
      .trim()
      .toLowerCase();


  let list=
    allProducts.filter(
      p=>

      (
        currentCategory==="All" ||
        String(
          p.category||""
        ).toLowerCase()===
        currentCategory.toLowerCase()
      )

      &&

      (
        !q ||
        String(
          p.name||""
        ).toLowerCase()
        .includes(q)
      )

    );


  if(!list.length){

    $("products").innerHTML=
      '<div class="empty">Is category mein abhi product nahi hai.</div>';

    return;

  }


  $("products").innerHTML=

    list.map(p=>{

      let im=imgs(p);

      return`

      <article class="product">

        <img
          src="${esc(im[0]||"")}"
          alt="${esc(p.name)}">

        <div class="pi">

          <h3>
            ${esc(p.name)}
          </h3>

          <div class="muted">
            ${esc(p.category||"")}
          </div>

          <div class="price">

            ₹${Number(
              p.price||0
            ).toLocaleString("en-IN")}

            ${
              p.original_price
              ?
              `<span class="old">
                ₹${Number(
                  p.original_price
                ).toLocaleString("en-IN")}
              </span>`
              :
              ""
            }

          </div>

          ${
            Number(p.stock||0)>0
            ?
            `<button
              class="btn"
              onclick="openOrder(${Number(p.id)})">
              Order Now
            </button>`
            :
            `<div class="out">
              Out of Stock
            </div>`
          }

        </div>

      </article>

      `;

    }).join("");

}


function openOrder(id){

  currentProduct=
    allProducts.find(
      p=>
        Number(p.id)===
        Number(id)
    );


  if(!currentProduct)
    return;


  selectedSize="";

  qty=1;


  let ss=
    sizes(currentProduct);


  let sizeHtml=
    ss.length
    ?

    `<label>Size</label>

     <div class="sizes">

       ${ss.map(
         s=>

         `<button
           type="button"
           class="size"
           onclick="pickSize('${esc(s)}',this)">
           ${esc(s)}
         </button>`

       ).join("")}

     </div>`

    :

    "";


  $("modalRoot").innerHTML=

  `<div
    class="modal"
    onclick="if(event.target===this)closeModal()">

    <div class="box">

      <h2>
        Place Order
      </h2>

      <p>
        <b>
          ${esc(currentProduct.name)}
        </b>

        <br>

        ₹${Number(
          currentProduct.price||0
        ).toLocaleString("en-IN")}

      </p>

      ${sizeHtml}

      <label>
        Quantity
      </label>

      <div class="qty">

        <button
          onclick="changeQty(-1)">
          −
        </button>

        <b id="qtyVal">
          1
        </b>

        <button
          onclick="changeQty(1)">
          +
        </button>

      </div>


      <label>
        Full Name *
      </label>

      <input
        id="oName"
        placeholder="Your name">


      <label>
        Mobile *
      </label>

      <input
        id="oPhone"
        maxlength="10"
        inputmode="numeric"
        placeholder="10 digit mobile">


      <label>
        Address *
      </label>

      <textarea id="oAddress"></textarea>


      <label>
        City *
      </label>

      <input id="oCity">


      <label>
        State *
      </label>

      <input id="oState">


      <label>
        PIN *
      </label>

      <input
        id="oPin"
        maxlength="6"
        inputmode="numeric">


      <label>
        Payment
      </label>

      <select id="oPay">

        <option>
          COD
        </option>

        <option>
          Online
        </option>

      </select>


      <button
        class="btn"
        id="placeBtn"
        onclick="placeOrder()">

        Confirm Order

      </button>


      <button
        class="btn"
        style="margin-top:8px;background:#777"
        onclick="closeModal()">

        Cancel

      </button>

    </div>

  </div>`;

}


function pickSize(s,b){

  selectedSize=s;

  document
    .querySelectorAll(".size")
    .forEach(
      x=>
        x.classList.remove("sel")
    );

  b.classList.add("sel");

}


function changeQty(d){

  qty=
    Math.max(
      1,
      qty+d
    );

  $("qtyVal")
    .textContent=qty;

}


function closeModal(){

  $("modalRoot")
    .innerHTML="";

}


async function placeOrder(){

  const btn=
    $("placeBtn");

  btn.disabled=true;

  btn.textContent=
    "Order save ho raha hai...";


  const name=
    $("oName").value.trim();

  const phone=
    $("oPhone").value.trim();

  const address=
    $("oAddress").value.trim();

  const city=
    $("oCity").value.trim();

  const state=
    $("oState").value.trim();

  const pin=
    $("oPin").value.trim();

  const pay=
    $("oPay").value;


  if(
    !name ||
    !/^\d{10}$/.test(phone) ||
    !address ||
    !city ||
    !state ||
    !/^\d{6}$/.test(pin)
  ){

    alert(
      "Details sahi bhariye."
    );

    btn.disabled=false;

    btn.textContent=
      "Confirm Order";

    return;

  }


  if(
    sizes(currentProduct).length &&
    !selectedSize
  ){

    alert(
      "Size select karein."
    );

    btn.disabled=false;

    btn.textContent=
      "Confirm Order";

    return;

  }


  const {
    data:{session}
  }=
    await sb.auth.getSession();


  const {
    data,
    error
  }=
    await sb.rpc(
      "place_order",
      {
        p_user_id:
          session?.user?.id||null,

        p_customer_name:
          name,

        p_phone:
          phone,

        p_address:
          address,

        p_city:
          city,

        p_state:
          state,

        p_pin_code:
          pin,

        p_product_id:
          Number(currentProduct.id),

        p_size:
          selectedSize||null,

        p_quantity:
          qty,

        p_payment_method:
          pay
      }
    );


  if(error){

    alert(
      "Order confirm nahi hua:\n"+
      error.message
    );

    btn.disabled=false;

    btn.textContent=
      "Confirm Order";

    return;

  }


  closeModal();

  alert(
    "Order Confirmed! ✅\n"+
    "Order ID: #"+data
  );

  showScreen("orders");

  loadProducts();

  loadOrders();

}


async function showScreen(id){

  document
    .querySelectorAll(".screen")
    .forEach(
      x=>
        x.classList.remove("active")
    );


  $(id)
    .classList.add("active");


  document
    .querySelectorAll(".bottom button")
    .forEach(
      x=>
        x.classList.remove("active")
    );


  $("nav"+
    id.charAt(0).toUpperCase()+
    id.slice(1))
    .classList.add("active");


  if(id==="orders")
    loadOrders();


  if(id==="account")
    loadAccount();


  scrollTo(0,0);

}


function goHome(){

  closeMenu();

  currentCategory="All";

  showScreen("home");

  $("productTitle")
    .textContent=
      "Latest Collection";

  renderProducts();

}


function openMenu(){

  $("drawer")
    .classList.add("open");

}


function closeMenu(){

  $("drawer")
    .classList.remove("open");

}


function contact(){

  alert(
    "Aarvi Fashion support se contact karein."
  );

  closeMenu();

}


function help(){

  alert(
    "Product choose karein → "+
    "size select karein → "+
    "details bharein → "+
    "Confirm Order."
  );

  closeMenu();

}


async function loadOrders(){

  const el=
    $("ordersList");

  el.innerHTML=
    '<div class="empty">Orders loading...</div>';


  const {
    data:{session}
  }=
    await sb.auth.getSession();


  if(!session){

    el.innerHTML=
      '<div class="empty">My Orders ke liye My Account se login karein.</div>';

    return;

  }


  const {
    data,
    error
  }=
    await sb
      .from("orders")
      .select("*")
      .eq(
        "user_id",
        session.user.id
      )
      .order(
        "created_at",
        {ascending:false}
      );


  if(error){

    el.innerHTML=
      '<div class="empty">Orders load nahi ho rahe.</div>';

    return;

  }


  if(!data?.length){

    el.innerHTML=
      '<div class="empty">Abhi koi order nahi hai.</div>';

    return;

  }


  el.innerHTML=

    data.map(
      o=>

      `<div class="order-card">

        <img
          src="${esc(o.product_image||"")}">

        <div style="flex:1">

          <b>
            ${esc(
              o.product_name||
              "Product"
            )}
          </b>

          <div class="muted">

            Order #${esc(o.id)}
            • Qty ${esc(o.quantity||1)}

            ${
              o.size
              ?
              ` • Size ${esc(o.size)}`
              :
              ""
            }

          </div>

          <div class="price">

            ₹${Number(
              o.total_amount||0
            ).toLocaleString("en-IN")}

          </div>

          <span class="badge">

            ${esc(
              o.order_status||
              "New"
            )}

          </span>


          ${
            o.tracking_number

            ?

            `<div style="margin-top:8px">

              <b>
                🚚 ${esc(
                  o.courier_name||
                  "Courier"
                )}
              </b>

              <br>

              ${esc(
                o.tracking_number
              )}

              ${
                o.tracking_url

                ?

                `<a
                  href="${esc(o.tracking_url)}"
                  target="_blank">
                  Track →
                </a>`

                :

                ""
              }

            </div>`

            :

            ""

          }

        </div>

      </div>`

    ).join("");

}


async function loadAccount(){

  const el=
    $("accountBox");


  const {
    data:{session}
  }=
    await sb.auth.getSession();


  if(!session){

    el.innerHTML=

    `<div class="profile">

      <h3>
        Login / Create Account
      </h3>

      <input
        id="aEmail"
        placeholder="Email">

      <input
        id="aPass"
        type="password"
        placeholder="Password">

      <button
        class="btn"
        onclick="accountLogin()">

        Login

      </button>

      <button
        class="btn"
        style="margin-top:8px;background:#777"
        onclick="accountSignup()">

        Create Account

      </button>

    </div>`;

    return;

  }


  const {
    data:p
  }=
    await sb
      .from("customer_profiles")
      .select("*")
      .eq(
        "id",
        session.user.id
      )
      .maybeSingle();


  el.innerHTML=

  `<div class="profile">

    <h3>
      👤 ${esc(
        p?.full_name||
        "My Account"
      )}
    </h3>

    <div class="muted">
      ${esc(
        session.user.email||
        ""
      )}
    </div>


    <div class="field">

      <label>
        Name
      </label>

      <input
        id="pName"
        value="${esc(
          p?.full_name||
          ""
        )}">

    </div>


    <div class="field">

      <label>
        Phone
      </label>

      <input
        id="pPhone"
        value="${esc(
          p?.phone||
          ""
        )}">

    </div>


    <div class="field">

      <label>
        Address
      </label>

      <textarea id="pAddress">${esc(
        p?.address||
        ""
      )}</textarea>

    </div>


    <button
      class="btn"
      onclick="saveProfile()">

      Save Profile

    </button>


    <button
      class="btn"
      style="margin-top:8px;background:#777"
      onclick="sb.auth.signOut().then(loadAccount)">

      Logout

    </button>

  </div>`;

}


async function accountLogin(){

  const email=
    $("aEmail")
      .value
      .trim();

  const password=
    $("aPass")
      .value;


  const {
    error
  }=
    await sb.auth.signInWithPassword({
      email,
      password
    });


  if(error)
    alert(error.message);

  else
    loadAccount();

}


async function accountSignup(){

  const email=
    $("aEmail")
      .value
      .trim();

  const password=
    $("aPass")
      .value;


  if(password.length<6){

    return alert(
      "Password kam se kam 6 characters ka ho."
    );

  }


  const {
    error
  }=
    await sb.auth.signUp({
      email,
      password
    });


  if(error)
    alert(error.message);

  else
    alert(
      "Account create ho gaya. Email confirmation required ho sakta hai."
    );

}


async function saveProfile(){

  const {
    data:{session}
  }=
    await sb.auth.getSession();


  if(!session)
    return;


  const obj={

    id:
      session.user.id,

    email:
      session.user.email,

    full_name:
      $("pName").value.trim(),

    phone:
      $("pPhone").value.trim(),

    address:
      $("pAddress").value.trim()

  };


  const {
    error
  }=
    await sb
      .from("customer_profiles")
      .upsert(obj);


  alert(
    error
    ?
    "Profile save nahi hua: "+
    error.message
    :
    "Profile saved ✅"
  );


  loadAccount();

}


loadProducts();

</script>

</body>
</html>
