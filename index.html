<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://sxifooelnulxldcbtmvd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_nLLITIJxfhc52cUkZaGZ4w_GvJubfM-";

const sb =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================================================
   GLOBAL
========================================================= */

let allProducts = [];

let selectedProduct = null;

let currentLoginMode = "email";

let currentAuthMode = "login";


/* =========================================================
   HELPERS
========================================================= */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function money(value){

  return Number(value || 0)
    .toLocaleString("en-IN");

}


function closeModal(){

  const m =
    document.querySelector(".modal");

  if(m) m.remove();

}


/* =========================================================
   PRODUCT IMAGES
========================================================= */

function getImages(product){

  let images=[];

  try{

    if(product.image_urls){

      images =
        JSON.parse(product.image_urls);

    }

  }catch(e){

    images=[];

  }

  if(!Array.isArray(images))
    images=[];

  if(!images.length && product.image_url)
    images=[product.image_url];

  return images.filter(Boolean);

}


/* =========================================================
   GALLERY
========================================================= */

function makeGallery(product){

  const images =
    getImages(product);

  if(!images.length){

    return `
      <div class="gallery">
        <div class="product-photo"></div>
      </div>
    `;

  }

  const photos =
    images.map((url,index)=>`

      <img
        src="${esc(url)}"
        class="product-photo"
        style="${index===0 ? "" : "display:none"}"
        alt="${esc(product.name)}"
      >

    `).join("");

  if(images.length===1){

    return `
      <div class="gallery">
        ${photos}
      </div>
    `;

  }

  return `
    <div class="gallery">

      ${photos}

      <div class="photo-buttons">

        <button
          type="button"
          onclick="prevPhoto(this)">
          ‹
        </button>

        <button
          type="button"
          onclick="nextPhoto(this)">
          ›
        </button>

      </div>

    </div>
  `;

}


function prevPhoto(button){

  const gallery =
    button.closest(".gallery");

  const photos =
    gallery.querySelectorAll(".product-photo");

  if(photos.length<2) return;

  let current=0;

  photos.forEach((p,i)=>{

    if(p.style.display!=="none")
      current=i;

  });

  photos[current].style.display="none";

  const previous =
    (current-1+photos.length)
    %photos.length;

  photos[previous].style.display="block";

}


function nextPhoto(button){

  const gallery =
    button.closest(".gallery");

  const photos =
    gallery.querySelectorAll(".product-photo");

  if(photos.length<2) return;

  let current=0;

  photos.forEach((p,i)=>{

    if(p.style.display!=="none")
      current=i;

  });

  photos[current].style.display="none";

  const next =
    (current+1)%photos.length;

  photos[next].style.display="block";

}


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function loadProducts(){

  const container =
    document.getElementById("products");

  container.innerHTML =
    `<div class="empty">
      Loading products...
    </div>`;

  const {data,error} =
    await sb
      .from("products")
      .select("*")
      .order("created_at",{ascending:false});

  if(error){

    console.error(error);

    container.innerHTML =
      `<div class="empty">
        Products load nahi ho rahe.<br>
        ${esc(error.message)}
      </div>`;

    return;

  }

  allProducts=data||[];

  renderProducts(allProducts);

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(products){

  const container =
    document.getElementById("products");

  if(!products.length){

    container.innerHTML =
      `<div class="empty">
        No products available yet.
      </div>`;

    return;

  }

  container.innerHTML =
    products.map(product=>{

      const stock =
        Number(product.stock||0);

      const original =
        Number(product.original_price||0);

      return `

        <article class="card">

          ${makeGallery(product)}

          <div class="info">

            <h3>
              ${esc(product.name||"Product")}
            </h3>

            <div class="category">
              ${esc(product.category||"")}
            </div>

            <div class="price">

              ₹${money(product.price)}

              ${
                original > Number(product.price||0)
                ?
                `<span class="original">
                   ₹${money(original)}
                 </span>`
                :
                ""
              }

            </div>

            <div class="stock">

              ${
                stock>0
                ?
                `Stock: ${stock}`
                :
                `<b style="color:#b52c2c">
                   Out of Stock
                 </b>`
              }

            </div>

            <button
              class="order"
              type="button"
              ${stock<=0 ? "disabled style='opacity:.5'" : ""}
              onclick="startOrder(${Number(product.id)})">

              ${
                stock>0
                ? "Order Now"
                : "Out of Stock"
              }

            </button>

            <button
              class="wish"
              type="button"
              onclick="toggleWishlist(${Number(product.id)})">

              ❤️ Add to Wishlist

            </button>

          </div>

        </article>

      `;

    }).join("");

}


/* =========================================================
   FILTER
========================================================= */

function filterProducts(category,button){

  document
    .querySelectorAll(".cats button")
    .forEach(b=>b.classList.remove("active"));

  if(button)
    button.classList.add("active");

  if(category==="All"){

    renderProducts(allProducts);
    return;

  }

  const filtered =
    allProducts.filter(p=>
      String(p.category||"")
      .toLowerCase()
      ===
      category.toLowerCase()
    );

  renderProducts(filtered);

}


/* =========================================================

========================================================= */

async function getSession(){

/* =========================================================
   AUTH MODAL
========================================================= */

function openAuth(){

  closeModal();

  currentAuthMode="login";

  const modal =
    document.createElement("div");

  modal.className="modal";

  modal.innerHTML=`

    <div class="modal-box">

      <button
        class="close"
        onclick="closeModal()">
        ×
      </button>

      <h2>🌸 Aarvi Fashion</h2>

      <div class="tabs">

        <button
          id="emailTab"
          class="active"
          onclick="switchLoginMode('email')">

          📧 Email

        </button>

        <button
          id="phoneTab"
          onclick="switchLoginMode('phone')">

          📱 Phone OTP

        </button>

      </div>

      <div class="tabs">

        <button
          id="loginTab"
          class="active"
          onclick="switchAuthMode('login')">

          Login

        </button>

        <button
          id="signupTab"
          onclick="switchAuthMode('signup')">

      <div id="authArea"></div>

  `;

function switchLoginMode(mode){

  currentLoginMode=mode;

  document
    .getElementById("emailTab")
    .classList.toggle(
      "active",
      mode==="email"
    );

  document
    .getElementById("phoneTab")
    .classList.toggle(
      "active",
      mode==="phone"
    );

  renderAuthForm();

}


function switchAuthMode(mode){

  currentAuthMode=mode;

  document
    .getElementById("loginTab")
    .classList.toggle(
      "active",
      mode==="login"
    );

  document
    .getElementById("signupTab")

========================================================= */

      <label>Password</label>

      <input
        id="authPassword"

      >

      <select id="accountType">

        <option value="Customer">

        </option>

        <option value="Supplier">

/* =========================================================
   EMAIL LOGIN
========================================================= */

async function emailLogin(){

  const email =
    document.getElementById("authEmail")
      .value.trim();

  const password =
    document.getElementById("authPassword")
      .value;

  const message =
    document.getElementById("authMessage");

  if(!email||!password){

    message.innerHTML =
      `<div class="error">
        Email aur password bhariye.
      </div>`;

    return;

  }

  const {error} =
    await sb.auth.signInWithPassword({
      email,
      password
    });

  if(error){

    message.innerHTML =
      `<div class="error">
        ${esc(error.message)}
      </div>`;

    return;

  }

  closeModal();

  alert("Login successful! ✅");

}


/* =========================================================
   EMAIL SIGNUP
========================================================= */

async function emailSignup(){

  const name =
    document.getElementById("signupName")
      .value.trim();

  const phone =
    document.getElementById("signupPhone")
      .value.trim();

  const email =
    document.getElementById("signupEmail")
      .value.trim();

  const password =
    document.getElementById("signupPassword")
      .value;

  const confirmPassword =
    document.getElementById("signupConfirm")
      .value;

  const accountType =
    document.getElementById("accountType")
      .value;

  const message =
    document.getElementById("authMessage");

  if(!name||!email||!password||!confirmPassword){

    message.innerHTML =
      `<div class="error">
        Required fields bhariye.
      </div>`;

    return;

  }

  if(phone && !/^[0-9]{10}$/.test(phone)){

    message.innerHTML =
      `<div class="error">
        Valid 10 digit phone number bhariye.
      </div>`;

    return;

  }

  if(password!==confirmPassword){

    message.innerHTML =
      `<div class="error">
        Password match nahi kar raha.
      </div>`;

    return;

  }

  if(password.length<6){

    message.innerHTML =
      `<div class="error">
        Password minimum 6 characters ka hona chahiye.
      </div>`;

    return;

  }


  const {data,error} =
    await sb.auth.signUp({

      email,
      password,

      options:{
        data:{
          full_name:name,
          phone:phone,
          account_type:accountType
        }
      }

    });


  if(error){

    message.innerHTML =
      `<div class="error">
        ${esc(error.message)}
      </div>`;

    return;

async function sendPhoneOTP(){

/* =========================================================
   VERIFY PHONE OTP
========================================================= */

async function verifyPhoneOTP(phone){

  const token =
    document.getElementById("otpCode")
      .value.trim();

  if(!/^[0-9]{6}$/.test(token)){

    alert("6 digit OTP bhariye.");

    return;

  }

  const {data,error} =
    await sb.auth.verifyOtp({

      phone:phone,
      token:token,
      type:"sms"

    });

  if(error){

    alert(
      "OTP verification failed:\n"+
      error.message
    );

    return;

  }

  if(data.user){

    const meta =
      data.user.user_metadata||{};

    await saveProfile(

      data.user,

      meta.full_name||"Customer",

      phone.replace("+91",""),

      meta.email||data.user.email||"",

      meta.account_type||"Customer"

    );

  }

  closeModal();

  alert(
    "Phone verified! Account ready hai. ✅"
  );

}

/* =========================================================
   SUBMIT ORDER
========================================================= */

async function submitOrder(){

  const session =
    await getSession();

  if(!session){

    alert(
      "Login required."
    );

    return;

  }

  const name =
    document.getElementById("orderName")
      .value.trim();

  const phone =
    document.getElementById("orderPhone")
      .value.trim();

  const address =
    document.getElementById("orderAddress")
      .value.trim();

  const city =
    document.getElementById("orderCity")
      .value.trim();

  const state =
    document.getElementById("orderState")
      .value.trim();

  const pincode =
    document.getElementById("orderPincode")
      .value.trim();

  const qty =
    Number(
      document.getElementById("orderQty").value
    );

  const payment =
    document.getElementById("orderPayment").value;


  if(!name){

    alert("Name bhariye.");
    return;

  }

  if(!/^[0-9]{10}$/.test(phone)){

    alert(
      "Valid 10 digit mobile number bhariye."
    );

    return;

  }

  if(!address||!city||!state){

    alert(
      "Address, city aur state bhariye."
    );

    return;

  }

  if(!/^[0-9]{6}$/.test(pincode)){

    alert("Valid 6 digit PIN bhariye.");

    return;

  }

  if(
    !qty ||
    qty<1 ||
    qty>Number(selectedProduct.stock||0)
  ){

    alert(
      "Valid quantity bhariye."
    );

    return;

  }


  const paymentStatus =
    payment==="COD"
    ? "COD"
    : "Pending";


  const orderData={

    user_id:
      session.user.id,

    Customer_Name:
      name,

    Phone:
      phone,

    Address:
      address,

    City:
      city,

    State:
      state,

    "Pin Code":
      pincode,

    Product_name:
      selectedProduct.name,

    Quantity:
      qty,

    Payment_method:
      payment,

    Payment_status:
      paymentStatus,

    Order_states:
      "New"

  };


  const {data,error} =
    await sb
      .from("ORDER'S")
      .insert([orderData])
      .select()
      .single();


  if(error){

    console.error(error);

    alert(
      "Order save nahi hua:\n"+
      error.message
    );

    return;

  }


  closeModal();


  const orderId =
    data?.id || "N/A";


  const whatsappText =
    `New Aarvi Fashion Order%0A%0A`+
    `Order ID: ${orderId}%0A`+
    `Customer: ${name}%0A`+
    `Phone: ${phone}%0A`+
    `Product: ${selectedProduct.name}%0A`+
    `Quantity: ${qty}%0A`+
    `Payment: ${payment}%0A`+
    `Address: ${address}, ${city}, ${state} - ${pincode}`;


  const whatsappUrl =
    "https://wa.me/916204117647?text="+
    whatsappText;


  const modal =
    document.createElement("div");

  modal.className="modal";

  modal.innerHTML=`

    <div class="modal-box"
         style="text-align:center">

      <h2>🎉 Order Placed!</h2>

      <div class="success">

        Aapka order successfully receive ho gaya hai.

      </div>

      <div class="notice">

        <b>Order ID:</b>
        ${esc(orderId)}

        <br><br>

        Status:
        <b>New</b>

      </div>


      <button
        class="primary"
        onclick="window.open('${whatsappUrl}','_blank')">

        📱 WhatsApp Order Details

      </button>


      <button
        class="secondary"
        onclick="closeModal()">

        Done

      </button>

    </div>

  `;

  document.body.appendChild(modal);

}

        </p>

      </div>

    </div>

  `;

  document.body.appendChild(modal);

}


/* =========================================================
   TRACK ORDER
========================================================= */

function openTrack(){

  closeModal();

  const modal =
    document.createElement("div");

  modal.className="modal";

  modal.innerHTML=`

    <div class="modal-box">

      <button class="close"
        onclick="closeModal()">
        ×
      </button>

      <h2>🚚 Track Your Order</h2>

      <label>Order ID</label>

      <input
        id="trackId"
        type="number"
        placeholder="Order ID"
      >

      <label>Mobile Number</label>

      <input
        id="trackPhone"
        type="tel"
        maxlength="10"
        inputmode="numeric"
        placeholder="10 digit mobile"
      >

      <button
        class="primary"
        onclick="trackOrder()">

        Track Order

      </button>

      <div
        id="trackResult"
        class="track-result">
      </div>

    </div>

  `;

  document.body.appendChild(modal);

}


async function trackOrder(){

  const id =
    Number(
      document.getElementById("trackId").value
    );

  const phone =
    document.getElementById("trackPhone")
      .value.trim();

  const result =
    document.getElementById("trackResult");

  if(!id||!phone){

    result.innerHTML=
      `<div class="error">
        Order ID aur mobile number bhariye.
      </div>`;

    return;

  }


  result.innerHTML=
    `<div class="notice">
      Order check ho raha hai...
    </div>`;


  const {data,error} =
    await sb.rpc(
      "track_my_order",
      {
        order_id_input:id,
        phone_input:phone
      }
    );


  if(error){

    result.innerHTML=
      `<div class="error">
        ${esc(error.message)}
      </div>`;

    return;

  }


  if(!data){

    result.innerHTML=
      `<div class="error">
        Order nahi mila.
      </div>`;

    return;

  }


  const status =
    data.Order_states ||
    data.Order_status ||
    data.status ||
    "New";


  result.innerHTML=`

    <div class="order-item">

      <h3 style="color:#d94f82">
        Order Found ✅
      </h3>

      <p>
        <b>Order ID:</b>
        ${esc(id)}
      </p>

      <p>
        <b>Product:</b>
        ${esc(
          data.Product_name||
          data.product_name||
          "-"
        )}
      </p>

      <div class="status">

        📦 ${esc(status)}

      </div>

    </div>

  `;

}

sb.auth.onAuthStateChange(
  async(event,session)=>{

    if(session){

      const meta =
        session.user.user_metadata||{};

      await saveProfile(

        session.user,

        meta.full_name||"Customer",

        meta.phone||
          session.user.phone||
          "",

        meta.email||
          session.user.email||
          "",

        meta.account_type||
          "Customer"

      );

    }

  }
);
