<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Aarvi Fashion</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff7fa;
  color:#392531
}

button,input,textarea,select{
  font:inherit
}

button{
  cursor:pointer;
  border:0
}

:root{
  --pink:#d94f82;
  --dark:#b83268;
  --soft:#fff0f5;
  --border:#f0d7e1
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:#fff
}

.top{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,255,255,.96);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  padding:6px 10px
}

.toprow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px
}

.brand{
  font-family:"Brush Script MT","Segoe Script","Lucida Handwriting",cursive;
  font-weight:700;
  color:#d94f82;
  font-size:24px;
  letter-spacing:1px;
  font-style:normal;
  line-height:1;
  text-shadow:0 1px 0 #fff
}

.icon{
  width:34px;
  height:34px;
  border-radius:13px;
  background:var(--soft);
  color:var(--dark);
  font-size:18px
}

.search{
  margin-top:6px;
  display:flex;
  background:#fff7fa;
  border:1px solid var(--border);
  border-radius:14px;
  padding:0 12px
}

.search input{
  border:0;
  outline:0;
  background:transparent;
  width:100%;
  padding:6px
}

main{
  padding:10px 10px 78px
}

.hero{
  background:linear-gradient(135deg,#fff0f5,#ffe2ed);
  border-radius:22px;
  padding:10px;
  margin-bottom:10px
}

.hero h1{
  margin:0 0 7px;
  font-size:21px
}

.hero p{
  margin:0;
  color:#765c67
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:10px 0 7px
}

.section-title h2{
  font-size:12px;
  margin:0
}

.cats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px
}

.cat{
  border:0;
  background:transparent;
  border-radius:50%;
  overflow:visible;
  text-align:center;
  padding:0
}

.cat img{
  width:54px;
  height:54px;
  margin:auto;
  display:block;
  object-fit:cover;
  background:var(--soft);
  border-radius:50%;
  border:1px solid var(--border)
}

.cat b{
  display:block;
  padding:4px 0 0;
  font-size:8px;
  line-height:1.15;
  font-weight:700
}

.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px
}

.product{
  border:1px solid var(--border);
  border-radius:17px;
  overflow:hidden;
  background:#fff
}

.product img{
  width:100%;
  height:78px;
  object-fit:contain;
  background:#fff0f5
}

.pi{
  padding:4px
}

.pi h3{
  margin:0 0 2px;
  font-size:9px;
  line-height:1.15
}

.muted{
  color:#806a73;
  font-size:10px
}

.price{
  color:var(--dark);
  font-weight:900;
  font-size:11px;
  margin:2px 0
}

.old{
  text-decoration:line-through;
  color:#999;
  font-size:10px;
  margin-left:4px
}

.btn{
  width:100%;
  padding:6px;
  border-radius:11px;
  background:var(--pink);
  color:#fff;
  font-weight:800
}

.out{
  color:#a52c2c;
  font-weight:700;
  font-size:10px
}

.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  height:58px;
  background:#fff;
  border-top:1px solid var(--border);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  z-index:25
}

.bottom button{
  background:#fff;
  color:#806a73
}

.bottom .active{
  color:var(--pink);
  font-weight:800
}

.drawer{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:50;
  display:none
}

.drawer.open{
  display:block
}

.menu{
  width:82%;
  max-width:390px;
  height:100%;
  background:#fff;
  padding:14px;
  overflow:auto
}

.menu h2{
  color:var(--dark)
}

.menu button{
  display:block;
  width:100%;
  text-align:left;
  padding:10px;
  border-radius:12px;
  background:#fff;
  margin:4px 0
}

.menu button:hover{
  background:var(--soft)
}

.screen{
  display:none
}

.screen.active{
  display:block
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:60;
  display:flex;
  align-items:flex-end
}

.box{
  width:100%;
  max-width:520px;
  margin:auto;
  background:#fff;
  border-radius:24px 24px 0 0;
  padding:14px;
  max-height:92vh;
  overflow:auto
}

.box input,
.box textarea,
.box select{
  width:100%;
  padding:9px;
  border:1px solid var(--border);
  border-radius:11px;
  margin:5px 0 12px
}

.sizes{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:8px 0 12px
}

.size{
  padding:7px 10px;
  border:1px solid var(--border);
  border-radius:10px;
  background:#fff
}

.size.sel{
  background:var(--pink);
  color:#fff
}

.qty{
  display:flex;
  align-items:center;
  gap:10px
}

.qty button{
  width:34px;
  height:34px;
  border-radius:10px;
  background:var(--soft)
}

.order-card{
  border:1px solid var(--border);
  border-radius:16px;
  padding:12px;
  margin:10px 0;
  display:flex;
  gap:12px
}

.order-card img{
  width:75px;
  height:90px;
  object-fit:contain;
  background:var(--soft);
  border-radius:10px
}

.badge{
  display:inline-block;
  padding:4px 7px;
  border-radius:20px;
  background:var(--soft);
  color:var(--dark);
  font-size:11px;
  font-weight:800
}

.profile{
  background:linear-gradient(135deg,#fff0f5,#fff);
  border:1px solid var(--border);
  padding:18px;
  border-radius:18px
}

.field{
  margin:8px 0
}

.field label{
  display:block;
  font-size:10px;
  font-weight:700;
  margin-bottom:4px
}

.empty{
  text-align:center;
  padding:35px 10px;
  color:#806a73
}

@media(max-width:380px){

  .cats{
    grid-template-columns:repeat(5,1fr);
    gap:3px
  }

  .cat img{
    width:44px;
    height:44px
  }

  .cat b{
    font-size:7px
  }

  .products{
    grid-template-columns:repeat(3,1fr);
    gap:4px
  }

  .product img{
    height:68px
  }

  .pi{
    padding:4px
  }

  .pi h3{
    font-size:9px
  }

  .price{
    font-size:11px
  }

  .btn{
    font-size:10px;
    padding:5px 3px
  }
}

/* ================= PROFILE / CONTACT / HELP / NOTIFICATIONS ================= */
.profile-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#fff0f5;border:2px solid #ead5dd}
.gallery-upload{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0 14px}
.gallery-upload img{width:100%;height:70px;object-fit:cover;border-radius:10px;background:#fff0f5;border:1px solid #ead5dd}
.contact-card,.help-card,.notification-card{border:1px solid #ead5dd;border-radius:14px;padding:12px;margin:8px 0;background:#fff}
.contact-card a{color:#3b2730;font-weight:800;text-decoration:none}
.notification-card{display:flex;gap:10px;align-items:center}
.notification-card.unread{background:#fff0f5}
.notification-card img{width:58px;height:58px;object-fit:cover;border-radius:10px;background:#fff0f5}
.notification-time{font-size:11px;color:#8a7880;margin-top:4px}
@media(max-width:420px){.avatar{width:62px;height:62px}.gallery-upload img{height:58px}}

</style>
</head>

<body>

<div class="app">

<header class="top">

<div class="toprow">

<button class="icon" onclick="openMenu()">☰</button>

<div class="brand">
AARVI FASHION
</div>

<button class="icon" onclick="showScreen('account')">
👤
</button>

</div>

<div class="search">

<span>⌕</span>

<input
id="search"
placeholder="Search products..."
oninput="renderProducts()">

</div>

</header>


<main>

<section id="home" class="screen active">

<div class="hero">

<h1>
Style that feels beautifully yours.
</h1>

<p>
Fashion • Beauty • Jewellery
</p>

</div>


<div class="section-title">

<h2>
Shop by Category
</h2>

</div>

<div id="cats" class="cats"></div>


<div class="section-title">

<h2 id="productTitle">
Latest Collection
</h2>

</div>

<div id="products" class="products"></div>

</section>


<section id="orders" class="screen">

<div class="section-title">

<h2>
My Orders
</h2>

<button
class="icon"
onclick="loadOrders()">
↻
</button>

</div>

<div id="ordersList"></div>

</section>


<section id="account" class="screen">

<div class="section-title">

<h2>
My Account
</h2>

</div>

<div id="accountBox"></div>

</section>

</main>


<nav class="bottom">

<button
id="navHome"
class="active"
onclick="showScreen('home')">

⌂
<br>
<small>Home</small>

</button>


<button
id="navOrders"
onclick="showScreen('orders')">

🛍
<br>
<small>Orders</small>

</button>


<button
id="navAccount"
onclick="showScreen('account')">

👤
<br>
<small>Account</small>

</button>

</nav>

</div>


<div
id="drawer"
class="drawer"
onclick="closeMenu()">

<div
class="menu"
onclick="event.stopPropagation()">

<button onclick="closeMenu()">
✕ Close
</button>

<h2>
Menu
</h2>

<button onclick="goHome()">
🏠 Home
</button>

<button
onclick="showScreen('orders');closeMenu()">

🛍️ My Orders

</button>

<button
onclick="showScreen('account');closeMenu()">

👤 My Account

</button>

<button onclick="contact()">
💬 Contact
</button>

<button onclick="help()">
❓ Help
</button>

</div>

</div>


<div id="modalRoot"></div>


<script>

const SUPABASE_URL=
"https://sxifooelnulxldcbtmvd.supabase.co";

const SUPABASE_KEY=
"sb_publishable_nLLITIJxfhc52cUkZaGZ4w_GvJubfM-";

const sb=
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);


let allProducts=[],
currentProduct=null,
selectedSize="",
qty=1,
currentCategory="All";


const CATS=[
"Plazzo",
"Pant Set",
"Dupatta Set",
"Kurta Set",
"Kurti Set",
"Dress Material",
"Combos",
"Daily Deals",
"Western Wear",
"Beauty",
"Jewellery"
];


const esc=v=>
String(v??"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");


function imgs(p){

let x=[];

try{

x=
Array.isArray(p.image_urls)
?p.image_urls
:JSON.parse(p.image_urls||"[]");

}catch{}

if(!x.length&&p.image_url)
x=[p.image_url];

return x.filter(Boolean).slice(0,4);

}


function sizes(p){

try{

return Array.isArray(p.sizes)
?p.sizes
:JSON.parse(p.sizes||"[]");

}catch{

return[];

}

}


async function loadProducts(){

const{
data,
error
}=await sb
.from("products")
.select("*")
.order(
"created_at",
{ascending:false}
);

if(error){

$("products").innerHTML=
'<div class="empty">Products load nahi ho rahe.</div>';

return;

}

allProducts=data||[];

renderCategories();

renderProducts();

}


const $=
id=>document.getElementById(id);


function categoryImage(c){

let p=
allProducts.find(
x=>
String(x.category||"").toLowerCase()
===
c.toLowerCase()
);

return p?imgs(p)[0]:"";

}


function renderCategories(){

$("cats").innerHTML=
CATS.map(c=>

`<button
class="cat"
onclick="filterCat('${esc(c)}')">

<img
src="${esc(categoryImage(c))}">

<b>
${esc(c)}
</b>

</button>`

).join("");

}


function filterCat(c){

currentCategory=c;

showScreen("home");

$("productTitle").textContent=
c==="All"
?"Latest Collection"
:c;

renderProducts();

}


function renderProducts(){

let q=
$("search").value
.trim()
.toLowerCase();

let list=
allProducts.filter(

p=>
(
currentCategory==="All"
||
String(p.category||"").toLowerCase()
===
currentCategory.toLowerCase()
)
&&
(
!q
||
String(p.name||"").toLowerCase()
.includes(q)
)

);


if(!list.length){

$("products").innerHTML=
'<div class="empty">Is category mein abhi product nahi hai.</div>';

return;

}


$("products").innerHTML=
list.map(p=>{

let im=imgs(p);

return `

<article class="product">

<img
src="${esc(im[0]||"")}">

<div class="pi">

<h3>
${esc(p.name)}
</h3>

<div class="muted">
${esc(p.category||"")}
</div>

<div class="price">

₹${Number(p.price||0)
.toLocaleString("en-IN")}

${
p.original_price
?
`<span class="old">
₹${Number(p.original_price)
.toLocaleString("en-IN")}
</span>`
:""
}

</div>

${
Number(p.stock||0)>0
?
`<button
class="btn"
onclick="openOrder(${Number(p.id)})">

Order Now

</button>`
:
`<div class="out">
Out of Stock
</div>`
}

</div>

</article>

`;

}).join("");

}


function openOrder(id){

currentProduct=
allProducts.find(
p=>Number(p.id)===Number(id)
);

if(!currentProduct)
return;

selectedSize="";
qty=1;

let ss=sizes(currentProduct);

let sizeHtml=
ss.length
?
`
<label>Size</label>

<div class="sizes">

${ss.map(s=>

`<button
type="button"
class="size"
onclick="pickSize('${esc(s)}',this)">

${esc(s)}

</button>`

).join("")}

</div>
`
:"";


$("modalRoot").innerHTML=

`

<div
class="modal"
onclick="if(event.target===this)closeModal()">

<div class="box">

<h2>
Place Order
</h2>

<p>

<b>
${esc(currentProduct.name)}
</b>

<br>

₹${Number(currentProduct.price||0)
.toLocaleString("en-IN")}

</p>

${sizeHtml}

<label>
Quantity
</label>

<div class="qty">

<button onclick="changeQty(-1)">
−
</button>

<b id="qtyVal">
1
</b>

<button onclick="changeQty(1)">
+
</button>

</div>

<label>
Full Name *
</label>

<input
id="oName"
placeholder="Your name">

<label>
Mobile *
</label>

<input
id="oPhone"
maxlength="10"
inputmode="numeric"
placeholder="10 digit mobile">

<label>
Address *
</label>

<textarea id="oAddress"></textarea>

<label>
City *
</label>

<input id="oCity">

<label>
State *
</label>

<input id="oState">

<label>
PIN *
</label>

<input
id="oPin"
maxlength="6"
inputmode="numeric">

<label>
Payment
</label>

<select id="oPay">

<option>
COD
</option>

<option>
Online
</option>

</select>

<button
class="btn"
id="placeBtn"
onclick="placeOrder()">

Confirm Order

</button>

<button
class="btn"
style="margin-top:8px;background:#777"
onclick="closeModal()">

Cancel

</button>

</div>

</div>

`;

}


function pickSize(s,b){

selectedSize=s;

document
.querySelectorAll(".size")
.forEach(x=>
x.classList.remove("sel")
);

b.classList.add("sel");

}


function changeQty(d){

qty=Math.max(
1,
qty+d
);

$("qtyVal").textContent=qty;

}


function closeModal(){

$("modalRoot").innerHTML="";

}


async function placeOrder(){

const btn=$("placeBtn");

btn.disabled=true;

btn.textContent=
"Order save ho raha hai...";


const name=
$("oName").value.trim();

const phone=
$("oPhone").value.trim();

const address=
$("oAddress").value.trim();

const city=
$("oCity").value.trim();

const state=
$("oState").value.trim();

const pin=
$("oPin").value.trim();

const pay=
$("oPay").value;


if(
!name||
!/^\d{10}$/.test(phone)||
!address||
!city||
!state||
!/^\d{6}$/.test(pin)
){

alert("Details sahi bhariye.");

btn.disabled=false;

btn.textContent=
"Confirm Order";

return;

}


if(
sizes(currentProduct).length
&&!selectedSize
){

alert("Size select karein.");

btn.disabled=false;

btn.textContent=
"Confirm Order";

return;

}


const{
data:{session}
}=await sb.auth.getSession();


const{
data,
error
}=await sb.rpc(
"place_order",
{

p_user_id:
session?.user?.id||null,

p_customer_name:name,

p_phone:phone,

p_address:address,

p_city:city,

p_state:state,

p_pin_code:pin,

p_product_id:
Number(currentProduct.id),

p_size:
selectedSize||null,

p_quantity:
qty,

p_payment_method:
pay

});


if(error){

alert(
"Order confirm nahi hua:\n"
+
error.message
);

btn.disabled=false;

btn.textContent=
"Confirm Order";

return;

}


closeModal();

alert(
"Order Confirmed! ✅\nOrder ID: #"
+
data
);

showScreen("orders");

loadProducts();

loadOrders();

}


async function showScreen(id){

document
.querySelectorAll(".screen")
.forEach(
x=>x.classList.remove("active")
);

$(id).classList.add("active");

document
.querySelectorAll(".bottom button")
.forEach(
x=>x.classList.remove("active")
);

$("nav"+
id.charAt(0).toUpperCase()
+
id.slice(1)
).classList.add("active");

if(id==="orders")
loadOrders();

if(id==="account")
loadAccount();

scrollTo(0,0);

}


function goHome(){

closeMenu();

currentCategory="All";

showScreen("home");

$("productTitle").textContent=
"Latest Collection";

renderProducts();

}


function openMenu(){

$("drawer").classList.add("open");

}


function closeMenu(){

$("drawer").classList.remove("open");

}


function contact(){

closeMenu();

$("modalRoot").innerHTML=`

<div class="modal show" onclick="if(event.target===this)closeModal()">

<div class="modal-box" style="max-width:520px">

<h2>💬 Aarvi Fashion Contact</h2>

<div class="contact-card">📞 <a href="tel:6204117647">Call: 6204117647</a></div>

<div class="contact-card">💬 <a href="https://wa.me/916204117647" target="_blank">WhatsApp: 6204117647</a></div>

<div class="contact-card">📧 <a href="mailto:amreshkumar97552@gmail.com">amreshkumar97552@gmail.com</a></div>

<div class="contact-card">📍 <b>Address:</b> Rahui, Nalanda</div>

<button class="btn btn-primary" onclick="closeModal()">Close</button>

function help(){

closeMenu();

$("modalRoot").innerHTML=`

<div class="modal show" onclick="if(event.target===this)closeModal()">

<div class="modal-box" style="max-width:620px">

<h2>❓ Aarvi Fashion Help</h2>

async function uploadCustomerPhoto(file,path){
const upload=await sb.storage.from("customer-profile").upload(path,file,{upsert:true,contentType:file.type});
if(upload.error) throw new Error(upload.error.message);
return sb.storage.from("customer-profile").getPublicUrl(path).data.publicUrl;
}

async function saveProfile(){

const{data:{session}}=await sb.auth.getSession();
if(!session)return;

const phone=$("pPhone").value.trim();
const email=$("pEmail").value.trim()||session.user.email||"";
const avatarFile=$("avatarFile")?.files?.[0];
const galleryFiles=[...($("galleryFiles")?.files||[])].slice(0,4);

try{
let avatarUrl=$("currentAvatar")?.value||null;
let gallery=[];
try{gallery=JSON.parse($("currentGallery")?.value||"[]")}catch(e){gallery=[]}
if(!Array.isArray(gallery))gallery=[];

if(avatarFile){
avatarUrl=await uploadCustomerPhoto(avatarFile,session.user.id+"/avatar-"+Date.now());
}

if(galleryFiles.length){
gallery=[];
for(let i=0;i<galleryFiles.length;i++){
gallery.push(await uploadCustomerPhoto(galleryFiles[i],session.user.id+"/gallery-"+Date.now()+"-"+i));
}
}

const{error}=await sb.from("customer_profiles").upsert({
id:session.user.id,
email:email,
phone:phone,
avatar_url:avatarUrl,
gallery_urls:JSON.stringify(gallery),
notifications_enabled:true
});

if(error)throw new Error(error.message);
alert("Profile saved successfully ✅");
loadAccount();
}catch(error){
alert("Profile save nahi hua:\n"+error.message);
}
}

async function loadNotifications(){
const{data:{session}}=await sb.auth.getSession();
if(!session)return;
const{data,error}=await sb.from("customer_notifications").select("*").eq("user_id",session.user.id).order("created_at",{ascending:false}).limit(30);
const box=$("notificationsBox");
if(!box)return;
if(error){box.innerHTML=`<div class="empty">Notifications load nahi ho rahe.</div>`;return;}
if(!data?.length){box.innerHTML=`<div class="empty">Abhi koi notification nahi hai.</div>`;return;}
box.innerHTML=data.map(n=>`
<div class="notification-card ${n.is_read?"":"unread"}">
${n.image_url?`<img src="${esc(n.image_url)}" alt="Offer">`:``}
<div>
<b>${esc(n.title||"Aarvi Fashion")}</b>
<div class="muted">${esc(n.message||"")}</div>
<div class="notification-time">${new Date(n.created_at).toLocaleString("en-IN")}</div>
</div>
</div>`).join("");
await sb.from("customer_notifications").update({is_read:true}).eq("user_id",session.user.id).eq("is_read",false);
}

async function enableNotifications(){
if(!("Notification" in window)){alert("Is browser mein notification supported nahi hai.");return;}
const permission=await Notification.requestPermission();
if(permission!=="granted"){alert("Notification permission Allow karein.");return;}
const{data:{session}}=await sb.auth.getSession();
if(session){await sb.from("customer_profiles").upsert({id:session.user.id,email:session.user.email,notifications_enabled:true});}
alert("Aarvi Fashion notifications ON ho gaye ✅");
}
