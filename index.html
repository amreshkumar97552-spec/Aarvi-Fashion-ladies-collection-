<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aarvi Fashion</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#fff7fa;
 color:#3a2430
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}

.wrap{max-width:1180px;margin:auto;padding:16px}

header{
 position:sticky;
 top:0;
 z-index:1000;
 background:#fff;
 border-bottom:1px solid #f0d8e1
}
.top{
 max-width:1180px;
 margin:auto;
 padding:12px 16px;
 display:flex;
 align-items:center;
 gap:10px
}
.brand{
 font-weight:900;
 color:#d94f82;
 font-size:22px;
 letter-spacing:2px;
 flex:1
}
.icon{
 border:1px solid #f0d8e1;
 background:#fff;
 color:#d94f82;
 border-radius:11px;
 padding:9px 11px
}
.search{
 max-width:1180px;
 margin:auto;
 padding:0 16px 12px
}
.search input{
 width:100%;
 padding:12px 14px;
 border:1px solid #ead4dd;
 border-radius:14px
}

.hero{
 padding:28px 0;
 text-align:center
}
.hero h1{
 font-size:36px;
 margin:0 0 8px
}
.hero p{color:#777}

.cats,.chips{
 display:flex;
 gap:8px;
 flex-wrap:wrap
}
.cats button,.chips button{
 border:1px solid #d94f82;
 background:#fff;
 color:#d94f82;
 padding:9px 14px;
 border-radius:22px
}
.cats button.active,
.cats button:hover,
.chips button.active{
 background:#d94f82;
 color:#fff
}

.section-title{
 display:flex;
 justify-content:space-between;
 align-items:center;
 margin:20px 0 10px
}
.section-title h2{
 margin:0;
 color:#d94f82
}

.products{
 display:grid;
 grid-template-columns:repeat(5,minmax(0,1fr));
 gap:9px
}
.card{
 background:#fff;
 border:1px solid #f0d8e1;
 border-radius:12px;
 overflow:hidden;
 box-shadow:0 2px 8px rgba(120,60,90,.06)
}
.photo{
 height:145px;
 background:#fff0f5;
 display:flex;
 align-items:center;
 justify-content:center;
 overflow:hidden;
 cursor:pointer;
 position:relative
}
.photo img{
 width:100%;
 height:100%;
 object-fit:cover;
 display:block;
 transition:transform .2s ease
}
.photo:hover img{transform:scale(1.03)}

.zoom{
 position:absolute;
 right:5px;
 bottom:5px;
 background:rgba(255,255,255,.9);
 border-radius:50%;
 width:25px;
 height:25px;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:13px
}

.section-badges{
 position:absolute;
 left:3px;
 top:3px;
 right:3px;
 display:flex;
 flex-wrap:wrap;
 gap:2px;
 z-index:2;
 pointer-events:none
}
.section-badge{
 font-size:7px;
 line-height:1;
 padding:2px 3px;
 border-radius:5px;
 background:rgba(255,255,255,.88);
 color:#d94f82;
 border:1px solid rgba(240,216,225,.8);
 font-weight:400
}

.info{padding:8px}
.name{
 font-weight:600;
 font-size:13px;
 line-height:1.25
}
.muted{
 color:#777;
 font-size:13px
}
.price{
 font-size:20px;
 font-weight:900;
 color:#d94f82;
 margin:7px 0
}
.old{
 text-decoration:line-through;
 color:#999;
 font-size:12px;
 margin-left:5px
}

.btn{
 width:100%;
 border:0;
 border-radius:10px;
 padding:10px;
 background:#d94f82;
 color:#fff;
 font-weight:800;
 margin-top:7px
}
.btn.secondary{
 background:#fff;
 color:#d94f82;
 border:1px solid #d94f82
}
.btn.dark{
 background:#3a2430
}
.btn.green{
 background:#26723a
}
.btn:disabled{
 opacity:.55;
 cursor:not-allowed
}

.empty{
 padding:35px;
 text-align:center;
 background:#fff;
 border:1px dashed #e4cbd5;
 border-radius:14px;
 grid-column:1/-1
}

.screen{display:none}
.screen.active{display:block}

.bottom{
 position:sticky;
 bottom:0;
 background:#fff;
 border-top:1px solid #ead4dd;
 display:flex;
 justify-content:space-around;
 z-index:900
}
.bottom button{
 flex:1;
 border:0;
 background:#fff;
 padding:9px;
 color:#666
}
.bottom button.active{
 color:#d94f82;
 font-weight:800
}

.drawer{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.45);
 z-index:3000;
 display:none
}
.drawer.open{display:block}

.menu{
 width:290px;
 max-width:85%;
 height:100%;
 background:#fff;
 padding:18px
}
.menu button{
 width:100%;
 padding:12px;
 margin:5px 0;
 border:1px solid #f0d8e1;
 background:#fff;
 border-radius:10px;
 text-align:left
}

.modal{
 position:fixed;
 inset:0;
 background:rgba(0,0,0,.55);
 z-index:5000;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:14px;
 overflow:auto
}
.box{
 width:100%;
 max-width:560px;
 background:#fff;
 border-radius:18px;
 padding:18px;
 position:relative;
 max-height:94vh;
 overflow:auto
}
.close{
 position:absolute;
 right:10px;
 top:10px;
 border:0;
 background:#fff0f5;
 color:#d94f82;
 border-radius:50%;
 width:34px;
 height:34px;
 font-size:20px
}

label{
 display:block;
 font-weight:700;
 font-size:13px;
 margin:10px 0 5px
}
input,textarea,select{
 width:100%;
 padding:11px;
 border:1px solid #ddd;
 border-radius:10px
}
textarea{min-height:80px}

.notice{
 background:#fff0f5;
 padding:10px;
 border-radius:10px;
 margin:10px 0;
 font-size:13px
}
.success{
 background:#eefbf2;
 color:#26723a;
 padding:10px;
 border-radius:10px;
 margin:10px 0
}
.error{
 background:#fff0f0;
 color:#a52c2c;
 padding:10px;
 border-radius:10px;
 margin:10px 0
}

.order-card,.policy,.cart-row{
 border:1px solid #f0d8e1;
 border-radius:12px;
 padding:12px;
 margin:8px 0;
 background:#fff
}

.badge{
 display:inline-block;
 background:#d94f82;
 color:#fff;
 border-radius:20px;
 padding:5px 9px;
 font-size:12px
}

.status-badge{
 display:inline-block;
 padding:6px 10px;
 border-radius:20px;
 background:#fff0f5;
 color:#d94f82;
 font-size:12px;
 font-weight:800
}

.size-row{
 display:flex;
 gap:7px;
 flex-wrap:wrap
}
.size{
 border:1px solid #d94f82;
 background:#fff;
 color:#d94f82;
 border-radius:8px;
 padding:7px 10px
}
.size.sel{
 background:#d94f82;
 color:#fff
}

.cart-row{
 display:flex;
 gap:10px;
 align-items:center
}
.cart-row img{
 width:65px;
 height:65px;
 object-fit:contain;
 background:#fff0f5;
 border-radius:8px
}
.qty{
 display:flex;
 gap:8px;
 align-items:center;
 flex-wrap:wrap;
 margin-top:7px
}
.qty button{
 border:1px solid #ddd;
 background:#fff;
 border-radius:7px;
 padding:4px 9px
}

.payment-box{
 border:1px solid #f0d8e1;
 background:#fff7fa;
 border-radius:12px;
 padding:12px;
 margin-top:10px
}
.razorpay-info{
 display:flex;
 align-items:center;
 gap:8px;
 font-weight:700;
 color:#d94f82
}

.shipping-box{
 border:1px solid #f0d8e1;
 background:#fff;
 border-radius:12px;
 padding:12px;
 margin-top:10px
}
.shipping-title{
 font-weight:800;
 color:#d94f82;
 margin-bottom:6px
}
.shipping-loading{
 color:#777;
 font-size:13px
}
.shipping-ok{
 color:#26723a;
 background:#eefbf2;
 padding:9px;
 border-radius:8px;
 font-size:13px
}
.shipping-error{
 color:#a52c2c;
 background:#fff0f0;
 padding:9px;
 border-radius:8px;
 font-size:13px
}

.total-box{
 border-top:1px solid #ead4dd;
 margin-top:12px;
 padding-top:12px
}
.total-line{
 display:flex;
 justify-content:space-between;
 margin:6px 0
}
.grand-total{
 font-size:20px;
 font-weight:900;
 color:#d94f82
}

.tracking-box{
 border:1px solid #ead4dd;
 background:#fff7fa;
 border-radius:12px;
 padding:12px;
 margin-top:10px
}
.tracking-head{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:8px;
 margin-bottom:10px
}
.tracking-title{
 font-size:16px;
 font-weight:900;
 color:#d94f82
}
.tracking-line{
 display:flex;
 justify-content:space-between;
 gap:10px;
 padding:7px 0;
 border-bottom:1px solid #f0d8e1;
 font-size:13px
}
.tracking-line:last-child{
 border-bottom:0
}
.tracking-label{
 color:#777
}
.tracking-value{
 font-weight:800;
 text-align:right
}
.timeline{
 margin-top:12px;
 padding-left:8px
}
.timeline-item{
 position:relative;
 padding:0 0 13px 25px;
 font-size:13px
}
.timeline-item:before{
 content:"";
 position:absolute;
 left:3px;
 top:2px;
 width:10px;
 height:10px;
 border-radius:50%;
 background:#d94f82
}
.timeline-item:after{
 content:"";
 position:absolute;
 left:7px;
 top:13px;
 bottom:-2px;
 width:2px;
 background:#ead4dd
}
.timeline-item:last-child:after{display:none}

.track-input-row{
 display:flex;
 gap:8px
}
.track-input-row input{
 flex:1
}
.track-input-row button{
 width:auto;
 margin-top:0;
 white-space:nowrap
}

.awb-box{
 background:#fff0f5;
 border-radius:10px;
 padding:10px;
 margin-top:8px
}
.awb-number{
 font-size:18px;
 font-weight:900;
 color:#d94f82;
 letter-spacing:1px
}

@media(max-width:900px){
 .products{
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:8px
 }
 .photo{height:125px}
}

@media(max-width:650px){
 .products{
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:6px
 }
 .hero h1{font-size:28px}
 .photo{height:105px}
 .brand{font-size:18px}
 .info{padding:6px}
 .name{
  font-size:10px;
  font-weight:600;
  line-height:1.2;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden
 }
 .muted{font-size:9px}
 .price{
  font-size:13px;
  margin:4px 0
 }
 .old{font-size:8px}
 .btn{
  font-size:10px;
  padding:7px 3px;
  border-radius:8px;
  margin-top:4px
 }
 .card{border-radius:9px}
 .track-input-row{
  flex-direction:column
 }
 .track-input-row button{
  width:100%
 }
}

@media(max-width:430px){
 .products{gap:5px}
 .photo{height:92px}
 .info{padding:5px}
 .name{
  font-size:9.5px;
  font-weight:600
 }
 .price{font-size:12px}
 .btn{
  font-size:9px;
  padding:6px 2px
 }
}
</style>
</head>

<body>

<header>
<div class="top">

<button class="icon" onclick="openMenu()">☰</button>

<div class="brand">AARVI FASHION</div>

<button class="icon" onclick="showNotifications()">🔔</button>

<button class="icon" onclick="showScreen('account')">👤</button>

</div>

<div class="search">
<input
 id="search"
 placeholder="Search products..."
 oninput="renderHome()">
</div>

</header>


<main class="wrap">

<section id="home" class="screen active">

<div class="hero">

<h1>Style that feels beautifully yours.</h1>

<p>
Fashion • Beauty • Jewellery • All India Delivery
</p>

<div id="cats" class="cats"></div>

</div>


<div class="section-title">
<h2>✨ New Arrivals</h2>
</div>

<div id="newArrivals" class="products"></div>


<div class="section-title">
<h2>🔥 Best Sellers</h2>
</div>

<div id="bestSellers" class="products"></div>


<div class="section-title">
<h2>💖 Under ₹999</h2>
</div>

<div id="under999" class="products"></div>


<div class="section-title">
<h2 id="productTitle">Latest Collection</h2>
</div>

<div id="products" class="products"></div>

</section>


<section id="orders" class="screen">

<div class="section-title">

<h2>📦 My Orders</h2>

<div>

<button class="icon" onclick="loadOrders()">↻</button>

<button class="icon" onclick="openTrack()">🚚</button>

</div>

</div>

<div id="ordersList"></div>

</section>


<section id="cart" class="screen">

<div class="section-title">
<h2>🛒 My Cart</h2>
</div>

<div id="cartList"></div>

</section>


<section id="account" class="screen">

<div class="section-title">
<h2>👤 My Account</h2>
</div>

<div id="accountBox"></div>

</section>

</main>


<nav class="bottom">

<button
 id="navHome"
 class="active"
 onclick="showScreen('home')">
⌂<br><small>Home</small>
</button>

<button
 id="navCart"
 onclick="showScreen('cart')">
🛒<br><small>Cart</small>
</button>

<button
 id="navOrders"
 onclick="showScreen('orders')">
🛍<br><small>Orders</small>
</button>

<button
 id="navAccount"
 onclick="showScreen('account')">
👤<br><small>Account</small>
</button>

</nav>


<div
 id="drawer"
 class="drawer"
 onclick="closeMenu()">

<div
 class="menu"
 onclick="event.stopPropagation()">

<button onclick="closeMenu()">✕ Close</button>

<h2>Menu</h2>

<button onclick="goHome()">🏠 Home</button>

<button onclick="showScreen('cart');closeMenu()">
🛒 Cart
</button>

<button onclick="showScreen('orders');closeMenu()">
📦 My Orders
</button>

<button onclick="showScreen('account');closeMenu()">
👤 My Account
</button>

<button onclick="showNotifications();closeMenu()">
🔔 Notifications
</button>

<button onclick="openTrack();closeMenu()">
🚚 Track Order
</button>

<button onclick="showPolicies();closeMenu()">
↩️ Return / Exchange Policy
</button>

<button onclick="contact()">
💬 Contact
</button>

</div>
</div>


<div id="modalRoot"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://sxifooelnulxldcbtmvd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_nLLITIJxfhc52cUkZaGZ4w_GvJubfM-";

const sb =
supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);


/* =========================================================
   RAZORPAY
========================================================= */

const RAZORPAY_KEY_ID =
"rzp_live_TPyDWh5CVTlttc";


/* =========================================================
   MAIN VARIABLES
========================================================= */

let allProducts = [];

let currentCategory = "All";

let currentProduct = null;

let selectedSize = "";

let qty = 1;

let shippingCharge = 0;

let shippingChecked = false;


/* =========================================================
   HELPERS
========================================================= */

const $ = id => document.getElementById(id);


function esc(v){

 return String(v ?? "")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");

}


function money(v){

 return Number(v || 0)
 .toLocaleString("en-IN");

}


function imgs(p){

 let a = [];

 try{

  a =
  Array.isArray(p.image_urls)
  ? p.image_urls
  : JSON.parse(p.image_urls || "[]");

 }catch{}

 if(!Array.isArray(a))
 a = [];

 if(!a.length && p.image_url)
 a = [p.image_url];

 return a.filter(Boolean);

}


function sizes(p){

 try{

  return Array.isArray(p.sizes)
  ? p.sizes
  : JSON.parse(p.sizes || "[]");

 }catch{

  return [];

 }

}


function closeModal(){

 $("modalRoot").innerHTML = "";

}


/* =========================================================
   IMAGE
========================================================= */

function openImage(src,name){

 if(!src)return;

 $("modalRoot").innerHTML = `

 <div
 class="modal"
 onclick="closeModal()">

 <div
 class="box"
 style="max-width:520px;padding:8px;background:#111"
 onclick="event.stopPropagation()">

 <button
 class="close"
 onclick="closeModal()">×</button>

 <img
 src="${esc(src)}"
 alt="${esc(name)}"
 style="display:block;width:100%;max-height:82vh;object-fit:contain;border-radius:12px;background:#fff">

 <div
 style="color:#fff;text-align:center;padding:8px 4px;font-weight:700">

 ${esc(name)}

 </div>

 </div>
 </div>`;

}


/* =========================================================
   MENU
========================================================= */

function openMenu(){

 $("drawer").classList.add("open");

}


function closeMenu(){

 $("drawer").classList.remove("open");

}


function goHome(){

 closeMenu();

 showScreen("home");

 currentCategory = "All";

 renderHome();

}


/* =========================================================
   SCREEN
========================================================= */

function showScreen(id){

 document
 .querySelectorAll(".screen")
 .forEach(x =>
  x.classList.remove("active")
 );

 $(id).classList.add("active");

 document
 .querySelectorAll(".bottom button")
 .forEach(x =>
  x.classList.remove("active")
 );

 $("nav" + id.charAt(0).toUpperCase() + id.slice(1))
 ?.classList.add("active");

 if(id === "orders")
 loadOrders();

 if(id === "cart")
 renderCart();

 if(id === "account")
 loadAccount();

 scrollTo(0,0);

}


/* =========================================================
   PRODUCTS
========================================================= */

async function loadProducts(){

 const c = $("products");

 c.innerHTML =
 '<div class="empty">Products loading...</div>';

 const r =
 await sb
 .from("products")
 .select("*")
 .order("id",{ascending:false});

 if(r.error){

  c.innerHTML =
  '<div class="empty">' +
  'Products load nahi ho rahe.<br>' +
  esc(r.error.message) +
  '</div>';

  return;

 }

 allProducts = r.data || [];

 renderCategories();

 renderHome();

}


/* =========================================================
   BADGES
========================================================= */

function sectionBadges(p){

 const badges = [];

 if(
  p.new_arrival === true ||
  p.new_arrival === 1 ||
  String(p.new_arrival).toLowerCase() === "true"
 )
 badges.push("🆕 New Arrival");


 if(
  p.latest === true ||
  p.latest === 1 ||
  String(p.latest).toLowerCase() === "true"
 )
 badges.push("✨ Latest");


 if(
  p.under_999 === true ||
  p.under_999 === 1 ||
  String(p.under_999).toLowerCase() === "true"
 )
 badges.push("💸 Under ₹999");


 if(
  p.best_seller === true ||
  p.best_seller === 1 ||
  String(p.best_seller).toLowerCase() === "true"
 )
 badges.push("🔥 Best Seller");


 return badges;

}


/* =========================================================
   PRODUCT CARD
========================================================= */

function productCard(p){

 const im =
 imgs(p)[0] || "";

 const stock =
 Number(p.stock || 0);

 const old =
 Number(p.original_price || 0);

 const badges =
 sectionBadges(p);

 return `

 <article class="card">

 <div
 class="photo"
 onclick="openImage(
 '${esc(im)}',
 '${esc(p.name || "Product")}'
 )">

 ${
  badges.length
  ?
  `<div class="section-badges">

  ${badges.map(b =>
  `<span class="section-badge">
  ${b}
  </span>`
  ).join("")}

  </div>`
  : ""
 }

 ${
  im
  ?
  `<img
   src="${esc(im)}"
   alt="${esc(p.name)}"
   loading="lazy">

   <span class="zoom">🔍</span>`
  : "🛍️"
 }

 </div>


 <div class="info">

 <div class="name">
 ${esc(p.name || "Product")}
 </div>

 <div class="muted">
 ${esc(p.category || "")}
 </div>

 <div class="price">

 ₹${money(p.price)}

 ${
  old > Number(p.price || 0)
  ?
  `<span class="old">
   ₹${money(old)}
   </span>`
  : ""
 }

 </div>

 <div class="muted">

 ${
  stock > 0
  ? `Stock: ${stock}`
  : "Out of Stock"
 }

 </div>


 <button
 class="btn"
 ${stock < 1 ? "disabled" : ""}
 onclick="buyNow(${Number(p.id)})">

 Buy Now

 </button>


 <button
 class="btn secondary"
 ${stock < 1 ? "disabled" : ""}
 onclick="addToCart(${Number(p.id)})">

 Add to Cart

 </button>

 </div>

 </article>`;

}


/* =========================================================
   CATEGORIES
========================================================= */

function renderCategories(){

 const cats = [
  "All",
  "Saree",
  "Kurti",
  "Dress",
  "Top",
  "Suit"
 ];

 $("cats").innerHTML =
 cats.map(c => `

 <button
 class="${c === currentCategory ? "active" : ""}"
 onclick="setCategory('${c}')">

 ${c}

 </button>

 `).join("");

}


function setCategory(c){

 currentCategory = c;

 renderCategories();

 renderHome();

}


/* =========================================================
   HOME
========================================================= */

function renderList(list,id){

 $(id).innerHTML =
 list.length
 ?
 list.map(productCard).join("")
 :
 '<div class="empty">' +
 'Is section mein abhi product nahi hai.' +
 '</div>';

}


function renderHome(){

 const q =
 $("search").value
 .trim()
 .toLowerCase();

 let base =
 allProducts.filter(p =>

  !q ||

  String(p.name || "")
  .toLowerCase()
  .includes(q) ||

  String(p.category || "")
  .toLowerCase()
  .includes(q)

 );


 let filtered =
 currentCategory === "All"
 ?
 base
 :

function addToCart(id){

 const p =
 allProducts.find(
  x => Number(x.id) === Number(id)
 );

 if(!p)return;

 let cart =
 JSON.parse(
  localStorage.getItem("aarvi_cart") || "[]"
 );


 const x =
 cart.find(
  i => Number(i.id) === Number(id)
 );


 if(x){

  x.qty =
  Math.min(
   x.qty + 1,
   Number(p.stock || 1)
  );

 }else{

  cart.push({
   id:Number(p.id),
   qty:1
  });

 }


 localStorage.setItem(
  "aarvi_cart",
  JSON.stringify(cart)
 );


 alert("Cart mein add ho gaya 🛒");

}


function getCart(){

 return JSON.parse(
  localStorage.getItem("aarvi_cart") || "[]"
 );

}


function renderCart(){

 const cart = getCart();

 if(!cart.length){

  $("cartList").innerHTML =
  '<div class="empty">' +
  'Cart abhi empty hai.' +
  '</div>';

  return;

 }

 let total = 0;


 $("cartList").innerHTML =

 cart.map(i => {

  const p =
  allProducts.find(
   x => Number(x.id) === Number(i.id)
  );

  if(!p)return "";

  const sub =
  Number(p.price || 0) * i.qty;

  total += sub;


  return `

  <div class="cart-row">

  <img
   src="${esc(imgs(p)[0] || "")}">

  <div style="flex:1">

  <b>${esc(p.name)}</b>

  <div>
  ₹${money(p.price)} × ${i.qty}
  </div>

  <div class="qty">

  <button
   onclick="changeCart(${p.id},-1)">
   −
  </button>

  <span>${i.qty}</span>

  <button
   onclick="changeCart(${p.id},1)">
   +
  </button>

  <button
   onclick="removeCart(${p.id})">
   Remove
  </button>

  </div>

  </div>

  </div>`;

 }).join("")

 +

 `

 <div class="order-card">

 <b>
 Total: ₹${money(total)}
 </b>

 <button
 class="btn"
 onclick="checkoutCart()">

 Checkout Cart

 </button>

 </div>

 `;

}


function changeCart(id,d){

 let c = getCart();

 let x =
 c.find(
  i => Number(i.id) === Number(id)
 );

 if(!x)return;


 x.qty =
 Math.max(1,x.qty+d);


 const p =
 allProducts.find(
  y => Number(y.id) === Number(id)
 );


 if(p){

  x.qty =
  Math.min(
   x.qty,
   Number(p.stock || 1)
  );

 }


 localStorage.setItem(
  "aarvi_cart",
  JSON.stringify(c)
 );


 renderCart();

}


function removeCart(id){

 localStorage.setItem(
  "aarvi_cart",
  JSON.stringify(
   getCart().filter(
    i => Number(i.id) !== Number(id)
   )
  )
 );

 renderCart();

}

/* =========================================================
   SHIPROCKET SHIPPING CHARGE
========================================================= */

async function checkShipping(){

 const pin =
 $("oPin")?.value.trim();

 const box =
 $("shippingBox");


 if(!box)return;


 shippingCharge = 0;

 shippingChecked = false;


 if(!/^[0-9]{6}$/.test(pin)){

  box.innerHTML = `

  <div class="shipping-title">
  🚚 Delivery Charges
  </div>

  <div class="shipping-loading">
  Valid 6 digit PIN enter karein.
  </div>

  `;

  updateOrderTotal();

  return;

 }


 box.innerHTML = `

 <div class="shipping-title">
 🚚 Delivery Charges
 </div>

 <div class="shipping-loading">
 ⏳ Delivery charge check ho raha hai...
 </div>

 `;


 try{

  const response =
  await fetch(
   "/api/shiprocket",
   {
    method:"POST",
    headers:{
     "Content-Type":"application/json"
    },
    body:JSON.stringify({

     action:"shipping_charge",

     deliveryPincode:pin,

     weight:0.5,

     cod:
     $("oPay")?.value === "COD"
     ? 1
     : 0

    })
   }
  );


  const data =
  await response.json();


  if(!response.ok ||
     data.success === false){

   throw new Error(
    data.error ||
    data.message ||
    "Shipping charge calculate nahi hua."
   );

  }


  const charge =
  Number(
   data.shippingCharge ??
   data.shipping_charge ??
   data.freight_charge ??
   data.rate ??
   data.amount ??
   data.data?.shippingCharge ??
   data.data?.shipping_charge ??
   data.data?.freight_charge ??
   data.data?.rate ??
   0
  );


  if(
   !Number.isFinite(charge) ||
   charge < 0
  ){

   throw new Error(
    "Shiprocket se valid shipping charge nahi mila."
   );

  }


  shippingCharge = charge;

  shippingChecked = true;


  box.innerHTML = `

  <div class="shipping-title">
  🚚 Delivery Available
  </div>

  <div class="shipping-ok">

  ✓ PIN ${esc(pin)}
  par delivery available

  <br>

  Shipping Charge:
  <b>₹${money(shippingCharge)}</b>

  </div>

  `;


  updateOrderTotal();


 }catch(error){

  shippingCharge = 0;

  shippingChecked = false;


  box.innerHTML = `

  <div class="shipping-title">
  🚚 Delivery Charges
  </div>

  <div class="shipping-error">

  ❌ ${esc(error.message)}

  <br><br>

  PIN code check karke dobara try karein.

  </div>

  `;


  updateOrderTotal();

 }

}


let pinTimer;


function pinChanged(){

 clearTimeout(pinTimer);

 shippingChecked = false;


 pinTimer =
 setTimeout(
  checkShipping,
  500
 );


 updateOrderTotal();

}

   btn.disabled = true;

   btn.textContent =

    btn.textContent =

   }

 try{

/* =========================================================
   TRACK MY ORDER
========================================================= */

async function trackMyOrder(orderId){

 const box =
 $("tracking-" + orderId);

 if(!box)return;

 box.innerHTML =
 '<div class="tracking-box">' +
 '<div class="shipping-loading">' +
 '⏳ Shiprocket tracking load ho rahi hai...' +
 '</div>' +
 '</div>';

 try{

  const {
   data:{session}
  } =
  await sb.auth.getSession();

  if(!session){
   throw new Error("Login required.");
  }

  const r =
  await sb
  .from("orders")
  .select("*")
  .eq("id",orderId)
  .eq("user_id",session.user.id)
  .maybeSingle();

  if(r.error)
   throw new Error(r.error.message);

  if(!r.data){
   throw new Error("Order nahi mila.");
  }

  const o = r.data;

  const awb =
   o.awb_code ||
   o.awb ||
   o.tracking_number ||
   o.trackingNumber ||
   "";

  const shipmentId =
   o.shipment_id ||
   o.shipmentId ||
   "";

  const shiprocketOrderId =
   o.shiprocket_order_id ||
   o.shiprocketOrderId ||
   "";

  /*
     Live Shiprocket tracking backend ko call karein.
     AWB ho to AWB se, warna shipment/order id se lookup hoga.
  */
  const response =
   await fetch(
    "/api/shiprocket",
    {
     method:"POST",
     headers:{
      "Content-Type":"application/json"
     },
     body:JSON.stringify({
      action:"track",
      awb:awb || null,
      shipmentId:shipmentId || null,
      shiprocketOrderId:shiprocketOrderId || null,
      orderId:String(orderId),
      phone:o.phone || ""
     })
    }
   );

  const data =
   await response.json();

  if(!response.ok || data.success === false){

   /* Agar shipment abhi Shiprocket me create/assign nahi hua,
      order ki saved information fir bhi dikhayein. */
   if(awb || shipmentId || shiprocketOrderId){
    box.innerHTML = trackingHTML({
     ...o,
     awb_code:awb,
     shipment_id:shipmentId,
     shiprocket_order_id:shiprocketOrderId,
     tracking_status:
      o.tracking_status ||
      o.shipment_status ||
      o.order_status ||
      "Shipment update pending"
    }) +
    '<div class="shipping-error">' +
    '⚠️ Live Shiprocket update abhi nahi mila.<br>' +
    esc(data.error || data.message || "Tracking unavailable") +
    '</div>';
    return;
   }

   throw new Error(
    data.error ||
    data.message ||
    "Shiprocket shipment/AWB abhi available nahi hai."
   );
  }

  const live =
   data.data ||
   data.tracking ||
   data.shipment ||
   data;

  box.innerHTML =
   trackingHTML({
    ...o,
    ...live,
    id:orderId,
    awb_code:
     live.awb_code ||
     live.awb ||
     live.awbCode ||
     awb,
    shipment_id:
     live.shipment_id ||
     live.shipmentId ||
     shipmentId,
    tracking_status:
     live.tracking_status ||
     live.shipment_status ||
     live.current_status ||
     live.status ||
     o.order_status ||
     "Shipment Update",
    courier_name:
     live.courier_name ||
     live.courier ||
     live.courierName ||
     o.courier_name ||
     "",
    etd:
     live.etd ||
     live.estimated_delivery ||
     live.estimatedDelivery ||
     o.etd ||
     "",
    tracking_activity:
     live.tracking_activity ||
     live.shipment_track_activities ||
     live.activity ||
     []
   });

 }catch(error){

  box.innerHTML =
  '<div class="tracking-box">' +
  '<div class="shipping-error">' +
  '❌ ' + esc(error.message) +
  '<br><br>' +
  'Shiprocket me shipment/AWB create hone ke baad live tracking yahan dikhegi.' +
  '</div>' +
  '</div>';
 }
}

 $("modalRoot").innerHTML = `

 </div>

 </div>

 </div>

 </div>`;

 try{

  const response =
  await fetch(
   "/api/shiprocket",

    headers:{

    },
    body:JSON.stringify({

/* =========================================================
   TRACK ORDER
========================================================= */

async function trackOrder(){

 const id =
 Number($("tId").value);


 const phone =
 $("tPhone").value.trim();


 if(
  !id ||
  !/^[0-9]{10}$/.test(phone)
 ){

  return alert(
   "Order ID aur valid mobile number bhariye."
  );

 }


 const result =
 $("tResult");


 result.innerHTML =
 '<div class="tracking-box">' +
 '<div class="shipping-loading">' +
 '⏳ Order tracking check ho rahi hai...' +
 '</div>' +
 '</div>';


 try{

  const r =
  await sb.rpc(
   "track_my_order",
   {
    order_id_input:id,
    phone_input:phone
   }
  );


  if(r.error){

   result.innerHTML =
   '<div class="error">' +
   esc(r.error.message) +
   '</div>';

   return;

  }


  const o =
  Array.isArray(r.data)
  ? r.data[0]
  : r.data;


  if(!o){

   result.innerHTML =
   '<div class="error">' +
   'Order nahi mila.' +
   '</div>';

   return;

  }


  result.innerHTML =
  trackingHTML({
   ...o,
   id:id
  });


 }catch(error){

  result.innerHTML =
  '<div class="error">' +
  esc(error.message) +
  '</div>';

 }

}
